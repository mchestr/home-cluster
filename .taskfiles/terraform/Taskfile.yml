---
version: "3"

x-env: &env
  # The claude-code pod gets both tokens from its ExternalSecret and has no op.
  cloudflare_api_token:
    sh: printenv CLOUDFLARE_TERRAFORM_TOKEN || op item --vault ${ONEPASSWORD_VAULT} get cloudflare --format json | jq -r '.fields.[] | select(.label == "CLOUDFLARE_TERRAFORM_TOKEN") | .value'
  onepassword_url: http://127.0.0.1:8080
  onepassword_token:
    sh: printenv OP_CONNECT_TOKEN || op item --vault ${ONEPASSWORD_VAULT} get 1password --format json | jq -r '.fields.[] | select(.label == "OP_CONNECT_TOKEN") | .value'

tasks:

  cf:init:
    desc: Initialize terraform dependencies
    dir: terraform/cloudflare
    env: *env
    cmds:
      - terraform init {{.CLI_ARGS}}

  cf:plan:
    desc: Show the changes terraform will make
    dir: terraform/cloudflare
    env: *env
    cmds:
      # 1Password Connect only runs in-cluster; tunnel it to onepassword_url for the run
      - defer: pkill -f "kubectl -n external-secrets port-forward svc/onepassword 8080:8080" || true
      - |
        kubectl -n external-secrets port-forward svc/onepassword 8080:8080 >/dev/null &
        for _ in $(seq 30); do curl -sf http://127.0.0.1:8080/heartbeat >/dev/null && break; sleep 0.5; done
        terraform plan {{.CLI_ARGS}} -var "cloudflare_api_token=${cloudflare_api_token}" -var "onepassword_url=${onepassword_url}" -var "onepassword_token=${onepassword_token}"

  cf:apply:
    desc: Apply the changes to Cloudflare
    dir: terraform/cloudflare
    env: *env
    cmds:
      # 1Password Connect only runs in-cluster; tunnel it to onepassword_url for the run
      - defer: pkill -f "kubectl -n external-secrets port-forward svc/onepassword 8080:8080" || true
      - |
        kubectl -n external-secrets port-forward svc/onepassword 8080:8080 >/dev/null &
        for _ in $(seq 30); do curl -sf http://127.0.0.1:8080/heartbeat >/dev/null && break; sleep 0.5; done
        terraform apply {{.CLI_ARGS}} -var "cloudflare_api_token=${cloudflare_api_token}" -var "onepassword_url=${onepassword_url}" -var "onepassword_token=${onepassword_token}"

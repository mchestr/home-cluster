---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ${APP}-volsync-check
spec:
  schedule: ${VOLSYNC_CHECK_SCHEDULE:-0 3 1 * *}
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 14400
      backoffLimit: 0
      template:
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              image: docker.io/restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              args:
                - check
                - --read-data-subset=10%
                - --no-lock
              env:
                - name: RESTIC_CACHE_DIR
                  value: /tmp/restic-cache
                - name: TMPDIR
                  value: /tmp
              envFrom:
                - secretRef:
                    name: ${APP}-volsync-secret
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          restartPolicy: Never
          volumes:
            - name: tmp
              emptyDir: {}

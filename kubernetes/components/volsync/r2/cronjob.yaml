---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ${APP}-volsync-check
spec:
  schedule: ${VOLSYNC_CHECK_SCHEDULE:-0 3 1 * *}
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 14400
      backoffLimit: 0
      template:
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              image: docker.io/restic/restic:0.18.1@sha256:39d9072fb5651c80d75c7a811612eb60b4c06b32ffe87c2e9f3c7222e1797e76
              args:
                - check
                - --read-data-subset=10%
                - --no-lock
              env:
                - name: RESTIC_CACHE_DIR
                  value: /tmp/restic-cache
                - name: TMPDIR
                  value: /tmp
              envFrom:
                - secretRef:
                    name: ${APP}-volsync-secret
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          restartPolicy: Never
          volumes:
            - name: tmp
              emptyDir: {}

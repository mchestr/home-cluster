---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${APP}-dragonfly-metrics
spec:
  podSelector:
    matchLabels:
      app: ${APP}-dragonfly
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9999
          protocol: TCP
    # The operator manages each pod, and replicas sync from the master, on the
    # admin port. Operator v1.7 no longer creates its own policy for this.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
          podSelector:
            matchLabels:
              app.kubernetes.io/name: dragonfly-operator
        - podSelector:
            matchLabels:
              app: ${APP}-dragonfly
      ports:
        - port: 9999
          protocol: TCP
    - from:
        - podSelector: {}
      ports:
        - port: 6379
          protocol: TCP

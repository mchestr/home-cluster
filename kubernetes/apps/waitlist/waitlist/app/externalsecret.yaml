---
# Everything Waitlist's own processes need. Each process gets only its own keys (helmrelease.yaml):
# waitlist-web the first five, waitlist-control only the last.
# See ../README.md for the 1Password fields.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app waitlist
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *app
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        WAITLIST_OAUTH_CLIENT_ID: "{{ .WAITLIST_OAUTH_CLIENT_ID }}"
        WAITLIST_OAUTH_CLIENT_SECRET: "{{ .WAITLIST_OAUTH_CLIENT_SECRET }}"
        WAITLIST_CHECKOUT_KEY: "{{ .WAITLIST_CHECKOUT_KEY }}"
        WAITLIST_VAPID_KEY: "{{ .WAITLIST_VAPID_KEY }}"
        WAITLIST_WEB_DB_PASSWORD: "{{ .waitlist_web_password }}"
        WAITLIST_CONTROL_DB_PASSWORD: "{{ .waitlist_control_password }}"
  dataFrom:
    - extract:
        key: waitlist
    - extract:
        key: authelia
    - extract:
        key: cloudnative-pg

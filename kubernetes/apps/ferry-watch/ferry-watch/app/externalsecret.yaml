---
# Everything Ferry Watch's own processes need. Each process mounts only its own keys (helmrelease.yaml):
# ferry-web gets the first four, ferry-control only its database password. See ../README.md for the fields.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app ferry-watch
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *app
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        FERRY_WATCH_CHECKOUT_KEY: "{{ .FERRY_WATCH_CHECKOUT_KEY }}"
        FERRY_WATCH_VAPID_KEY: "{{ .FERRY_WATCH_VAPID_KEY }}"
        FERRY_WATCH_OAUTH_CLIENT_SECRET: "{{ .FERRY_WATCH_OAUTH_CLIENT_SECRET }}"
        FERRY_WATCH_WEB_DB_PASSWORD: "{{ .ferrywatch_web_password }}"
        FERRY_WATCH_CONTROL_DB_PASSWORD: "{{ .ferrywatch_control_password }}"
  dataFrom:
    - extract:
        key: ferry-watch
    - extract:
        key: authelia
    - extract:
        key: cloudnative-pg

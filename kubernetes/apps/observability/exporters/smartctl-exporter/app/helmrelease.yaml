---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app smartctl-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: smartctl-exporter
  maxHistory: 2
  values:
    fullnameOverride: *app
    serviceMonitor:
      enabled: true
    # Chart rules duplicate prometheusrule.yaml and warn at 60°C, well below the drives' own limits
    prometheusRules:
      enabled: false

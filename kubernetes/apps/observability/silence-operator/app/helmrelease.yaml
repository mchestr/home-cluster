---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: silence-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: silence-operator
  maxHistory: 2
  dependsOn:
    - name: silence-operator-crds
      namespace: observability
  values:
    image:
      name: quay.io/giantswarm/silence-operator
    operator:
      config:
        alertmanager:
          service:
            address: http://alertmanager-operated.observability.svc.cluster.local:9093
    rbac:
      create: true
    extraDeploy:
      - apiVersion: monitoring.giantswarm.io/v1alpha1
        kind: Silence
        metadata:
          name: ceph-node-nfsmount-diskspace-warning
          namespace: observability
        spec:
          matchers:
            - name: alertname
              value: CephNodeDiskspaceWarning
              isRegex: false
            - name: mountpoint
              value: /etc/nfsmount.conf
              isRegex: false
      - apiVersion: monitoring.giantswarm.io/v1alpha1
        kind: Silence
        metadata:
          name: ceph-node-local-diskspace-warning
          namespace: observability
        spec:
          matchers:
            - name: alertname
              value: CephNodeDiskspaceWarning
              isRegex: false
            - name: mountpoint
              value: /var
              isRegex: false
      - apiVersion: monitoring.giantswarm.io/v1alpha1
        kind: Silence
        metadata:
          name: ceph-node-inconsistent-mtu
          namespace: observability
        spec:
          matchers:
            - name: alertname
              value: CephNodeInconsistentMTU
              isRegex: false
      - apiVersion: monitoring.giantswarm.io/v1alpha1
        kind: Silence
        metadata:
          name: ceph-node-packet-drop
          namespace: observability
        spec:
          matchers:
            - name: alertname
              value: CephNodeNetworkPacketDrops
              isRegex: false
      - apiVersion: monitoring.giantswarm.io/v1alpha1
        kind: Silence
        metadata:
          name: ceph-node-packet-error
          namespace: observability
        spec:
          matchers:
            - name: alertname
              value: CephNodeNetworkPacketErrors
              isRegex: false
      # Ferry Watch's browser pods come and go by design: ferry-control starts, reaps and replaces them, and a
      # full quota just means the fleet is at its limit. Ferry Watch's admin page shows what needs attention.
      - apiVersion: monitoring.giantswarm.io/v1alpha1
        kind: Silence
        metadata:
          name: ferry-watch-browsers
          namespace: observability
        spec:
          matchers:
            - name: namespace
              value: ferry-watch-browsers
              isRegex: false
            - name: alertname
              value: OomKilled|KubePodNotReady|KubePodCrashLooping|KubeContainerWaiting|KubeQuota.*
              isRegex: true

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: gatus-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # HealthChecks
        STATUS_PAGE_HEARTBEAT_URL: "{{ .STATUS_PAGE_HEARTBEAT_URL }}"
  dataFrom:
    - extract:
        key: healthchecks

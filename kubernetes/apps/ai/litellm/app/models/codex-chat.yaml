---
# Test model: OpenAI GPT-5.5 through the ChatGPT subscription, served by the
# in-cluster CLIProxyAPI (ai/cliproxyapi) after its Codex device login.
# No client uses it yet. Type this name in a client to try it.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: codex-chat
spec:
  modelName: codex-chat
  params:
    model: openai/gpt-5.5
    apiBase: http://cliproxyapi.ai.svc.cluster.local:8317/v1
    apiKeyRef:
      name: litellm-secret
      key: CLIPROXYAPI_API_KEY

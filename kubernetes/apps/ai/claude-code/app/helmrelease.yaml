---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app claude-code
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  values:
    defaultPodOptions:
      # kubectl, flux and the MCP servers act as the claude-code ServiceAccount
      # (rbac.yaml).
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    serviceAccount:
      claude-code: {}
    controllers:
      claude-code:
        annotations:
          reloader.stakater.com/auto: "true"
        # One Remote Control server per login; never run two side by side.
        strategy: Recreate
        serviceAccount:
          identifier: claude-code
        initContainers:
          # The same CLIs as on the Mac; versions live in resources/tools.env.
          install-tools:
            image:
              repository: docker.io/library/busybox
              tag: "1.38"
            command: ["sh", "/scripts/install-tools.sh"]
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            # Debian with git, curl, ssh, perl, python and npx (for
            # kubernetes-mcp-server). claude itself is the native binary,
            # installed onto the PVC by resources/entrypoint.sh.
            image:
              repository: docker.io/library/node
              tag: 24-bookworm
            command: ["bash", "/scripts/entrypoint.sh"]
            env:
              HOME: /home/claude
              TZ: America/Vancouver
              PATH: /home/claude/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              TALOSCONFIG: /etc/talos/config
              # Remote Control refuses to start with ANTHROPIC_API_KEY,
              # ANTHROPIC_AUTH_TOKEN, CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC or
              # DISABLE_GROWTHBOOK set, so none of them belong here.
              GITHUB_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: claude-code-secret
                    key: GITHUB_TOKEN
              # memini plugin: the in-cluster service rather than
              # memini.chestr.dev, so memory traffic never leaves the cluster.
              # No trailing slash; the plugin appends /mcp.
              MEMINI_BASE_URL: http://memini.ai.svc.cluster.local:8080
              # memini's own Secret (same namespace) holds the shared token.
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secret
                    key: MEMINI_API_KEY
            # No probes: Remote Control serves nothing in-cluster to check, and
            # the process exits on its own (restarting the pod) when it loses
            # Anthropic for ~10 minutes.
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            securityContext: *securityContext
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
    persistence:
      home:
        existingClaim: *app
        globalMounts:
          - path: /home/claude
      scripts:
        type: configMap
        name: claude-code-scripts
        globalMounts:
          - path: /scripts
            readOnly: true
      talosconfig:
        type: secret
        name: claude-code-secret
        advancedMounts:
          claude-code:
            app:
              - path: /etc/talos/config
                subPath: talosconfig
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

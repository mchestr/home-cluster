---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app claude-code
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  values:
    defaultPodOptions:
      automountServiceAccountToken: true
      # Stable session names across rollouts.
      hostname: claude-code
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    serviceAccount:
      claude-code: {}
    controllers:
      claude-code:
        annotations:
          reloader.stakater.com/auto: "true"
        # One Remote Control server per login.
        strategy: Recreate
        serviceAccount:
          identifier: claude-code
        initContainers:
          install-tools:
            image:
              repository: docker.io/library/busybox
              tag: "1.38"
            command: ["sh", "/scripts/install-tools.sh"]
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: docker.io/library/node
              tag: 24-bookworm
            command: ["bash", "/scripts/entrypoint.sh"]
            env:
              HOME: /home/claude
              TZ: America/Vancouver
              PATH: /home/claude/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              # task keeps these values instead of the Taskfile's local paths.
              KUBECONFIG: /home/claude/.kube/config
              TALOSCONFIG: /etc/talos/config
              # No ANTHROPIC_* or DISABLE_* vars: Remote Control refuses them (README).
              GITHUB_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: claude-code-secret
                    key: GITHUB_TOKEN
              # Empty skips the Home Assistant MCP server in entrypoint.sh.
              HASS_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: claude-code-secret
                    key: HASS_TOKEN
              # No trailing slash; the plugin appends /mcp.
              MEMINI_BASE_URL: http://memini.ai.svc.cluster.local:8080
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secret
                    key: MEMINI_API_KEY
            # Nothing to probe; claude exits on its own after ~10m offline.
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            securityContext: *securityContext
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
    persistence:
      home:
        existingClaim: *app
        globalMounts:
          - path: /home/claude
      scripts:
        type: configMap
        name: claude-code-scripts
        globalMounts:
          - path: /scripts
            readOnly: true
      talosconfig:
        type: secret
        name: claude-code-secret
        advancedMounts:
          claude-code:
            app:
              - path: /etc/talos/config
                subPath: talosconfig
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

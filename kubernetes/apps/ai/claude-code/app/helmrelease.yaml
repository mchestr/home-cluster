---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app claude-code
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  values:
    defaultPodOptions:
      # kubectl, flux and the MCP servers act as the claude-code ServiceAccount
      # (rbac.yaml).
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    serviceAccount:
      claude-code: {}
    controllers:
      claude-code:
        annotations:
          reloader.stakater.com/auto: "true"
        # One Remote Control server per login; never run two side by side.
        strategy: Recreate
        serviceAccount:
          identifier: claude-code
        # The same CLIs as on the Mac, installed on the PVC at ~/.local/bin and
        # only re-downloaded when a version changes. $$ escapes Flux postBuild
        # so the shell receives a literal $.
        initContainers:
          install-tools:
            image:
              repository: docker.io/library/busybox
              tag: "1.38"
            command:
              - sh
              - -c
              - |
                set -eu
                # renovate: datasource=github-releases depName=kubernetes/kubernetes
                KUBECTL_VERSION=v1.36.5
                # renovate: datasource=github-releases depName=fluxcd/flux2
                FLUX_VERSION=v2.9.6
                # renovate: datasource=github-releases depName=controlplaneio-fluxcd/flux-operator
                FLUX_OPERATOR_VERSION=v0.61.0
                # Keep in step with kubernetes/apps/system-upgrade/tuppr/upgrades/talos.yaml.
                # renovate: datasource=github-releases depName=siderolabs/talos
                TALOS_VERSION=v1.13.10
                # renovate: datasource=github-releases depName=go-task/task
                TASK_VERSION=v3.54.0
                # renovate: datasource=github-releases depName=cli/cli
                GH_VERSION=v2.102.0
                # renovate: datasource=github-releases depName=helm/helm
                HELM_VERSION=v4.3.1
                KUSTOMIZE_VERSION=v5.8.3
                # renovate: datasource=github-releases depName=mikefarah/yq
                YQ_VERSION=v4.54.1
                JQ_VERSION=1.8.2
                BIN=/home/claude/.local/bin
                mkdir -p "$$BIN"
                # install <name> <version> <url> [path of the binary in the tarball]
                install() {
                  [ "$$(cat "$$BIN/.$$1ver" 2>/dev/null)" = "$$2" ] && return 0
                  echo "installing $$1 $$2"
                  if [ -z "$${4:-}" ]; then
                    wget -qO "$$BIN/$$1" "$$3"
                  else
                    rm -rf /tmp/x && mkdir -p /tmp/x
                    wget -qO /tmp/x/a.tar.gz "$$3"
                    tar -xzf /tmp/x/a.tar.gz -C /tmp/x
                    cp "/tmp/x/$$4" "$$BIN/$$1"
                    rm -rf /tmp/x
                  fi
                  chmod +x "$$BIN/$$1"
                  printf '%s' "$$2" > "$$BIN/.$$1ver"
                }
                GH=https://github.com
                install kubectl "$$KUBECTL_VERSION" "https://dl.k8s.io/release/$$KUBECTL_VERSION/bin/linux/amd64/kubectl"
                install flux "$$FLUX_VERSION" "$$GH/fluxcd/flux2/releases/download/$$FLUX_VERSION/flux_$${FLUX_VERSION#v}_linux_amd64.tar.gz" flux
                install flux-operator-mcp "$$FLUX_OPERATOR_VERSION" "$$GH/controlplaneio-fluxcd/flux-operator/releases/download/$$FLUX_OPERATOR_VERSION/flux-operator-mcp_$${FLUX_OPERATOR_VERSION#v}_linux_amd64.tar.gz" flux-operator-mcp
                install talosctl "$$TALOS_VERSION" "$$GH/siderolabs/talos/releases/download/$$TALOS_VERSION/talosctl-linux-amd64"
                install task "$$TASK_VERSION" "$$GH/go-task/task/releases/download/$$TASK_VERSION/task_linux_amd64.tar.gz" task
                install gh "$$GH_VERSION" "$$GH/cli/cli/releases/download/$$GH_VERSION/gh_$${GH_VERSION#v}_linux_amd64.tar.gz" "gh_$${GH_VERSION#v}_linux_amd64/bin/gh"
                install helm "$$HELM_VERSION" "https://get.helm.sh/helm-$$HELM_VERSION-linux-amd64.tar.gz" linux-amd64/helm
                install kustomize "$$KUSTOMIZE_VERSION" "$$GH/kubernetes-sigs/kustomize/releases/download/kustomize%2F$$KUSTOMIZE_VERSION/kustomize_$${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" kustomize
                install yq "$$YQ_VERSION" "$$GH/mikefarah/yq/releases/download/$$YQ_VERSION/yq_linux_amd64"
                install jq "$$JQ_VERSION" "$$GH/jqlang/jq/releases/download/jq-$$JQ_VERSION/jq-linux-amd64"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            # Debian with git, curl, ssh, python and npx (for kubernetes-mcp-server).
            # claude itself is the native binary installed onto the PVC, which
            # keeps itself up to date.
            image:
              repository: docker.io/library/node
              tag: 24-bookworm
            command:
              - /bin/bash
              - -c
              - |
                set -euo pipefail
                if ! command -v claude >/dev/null; then
                  curl -fsSL https://claude.ai/install.sh | bash
                fi

                # kubeconfig for the ServiceAccount, so kubectl, flux, helm and
                # both MCP servers behave as they do with a normal kubeconfig.
                # tokenFile picks up token rotation.
                SA=/var/run/secrets/kubernetes.io/serviceaccount
                mkdir -p "$$HOME/.kube"
                cat > "$$HOME/.kube/config" <<KUBE
                apiVersion: v1
                kind: Config
                clusters:
                  - name: home
                    cluster:
                      server: https://kubernetes.default.svc
                      certificate-authority: $$SA/ca.crt
                users:
                  - name: claude-code
                    user:
                      tokenFile: $$SA/token
                contexts:
                  - name: home
                    context: { cluster: home, user: claude-code, namespace: default }
                current-context: home
                KUBE

                git config --global user.name "Mike Chester"
                git config --global user.email "mike@chester.io"
                # gh reads GITHUB_TOKEN from the env; this makes git push use it too.
                gh auth setup-git >/dev/null 2>&1 || true

                REPO="$$HOME/home-cluster"
                if [ ! -d "$$REPO/.git" ]; then
                  git clone https://github.com/mchestr/home-cluster.git "$$REPO"
                fi

                mkdir -p "$$HOME/.claude"
                if [ ! -f "$$HOME/.claude/CLAUDE.md" ]; then
                  printf '%s\n' "- never include claude as an author in commit messages" > "$$HOME/.claude/CLAUDE.md"
                fi
                # Same MCP servers as the Mac session.
                claude mcp get kubernetes >/dev/null 2>&1 \
                  || claude mcp add -s user kubernetes -- npx -y kubernetes-mcp-server@latest || true
                claude mcp get flux-operator >/dev/null 2>&1 \
                  || claude mcp add -s user flux-operator -- flux-operator-mcp serve || true

                # Remote Control needs a full claude.ai login plus a one-time
                # interactive "Enable Remote Control?" / workspace-trust answer,
                # neither of which works without a TTY. Idle until that bootstrap
                # (README.md beside this app) has been done.
                if [ ! -f "$$HOME/.remote-control-ready" ]; then
                  echo "claude-code: not bootstrapped; see kubernetes/apps/ai/claude-code/README.md"
                  exec sleep infinity
                fi
                cd "$$REPO"
                git pull --ff-only -q || true
                # Remote Control redraws its status block about once a second
                # with cursor escapes, which without a TTY lands in the log as a
                # fresh copy every time. Strip the escapes and only print a line
                # not seen in the last 10 minutes: changes show at once and the
                # status repeats as a heartbeat. exec keeps claude as PID 1.
                exec > >(perl -ne 'BEGIN { $$| = 1 } s/\e\[[0-9;?]*[A-Za-z]//g; s/\e\]8;;[^\a]*\a//g; next if /^\s*$$/; my $$t = time; next if exists $$seen{$$_} && $$t - $$seen{$$_} < 600; $$seen{$$_} = $$t; print') 2>&1
                # default permission mode: every tool call outside the repo's
                # allowlist is forwarded to claude.ai / the app for approval.
                exec claude remote-control \
                  --name home-cluster \
                  --spawn worktree \
                  --permission-mode default
            env:
              HOME: &home /home/claude
              TZ: America/Vancouver
              PATH: /home/claude/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              TALOSCONFIG: /etc/talos/config
              # Remote Control refuses to start with ANTHROPIC_API_KEY,
              # ANTHROPIC_AUTH_TOKEN, CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC or
              # DISABLE_GROWTHBOOK set, so none of them belong here.
              GITHUB_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: claude-code-secret
                    key: GITHUB_TOKEN
            # No probes: Remote Control serves nothing in-cluster to check, and
            # the process exits on its own (restarting the pod) when it loses
            # Anthropic for ~10 minutes.
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
    persistence:
      home:
        existingClaim: *app
        globalMounts:
          - path: *home
      talosconfig:
        type: secret
        name: claude-code-secret
        advancedMounts:
          claude-code:
            app:
              - path: /etc/talos/config
                subPath: talosconfig
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

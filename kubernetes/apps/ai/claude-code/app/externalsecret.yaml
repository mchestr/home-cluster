# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-code
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: claude-code-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GITHUB_TOKEN: "{{ .GITHUB_TOKEN }}"
        HASS_TOKEN: "{{ .HASS_TOKEN }}"
        talosconfig: "{{ .TALOSCONFIG }}"
        # Optional (index returns "" for a missing field): op and terraform for task terraform:*.
        OP_SERVICE_ACCOUNT_TOKEN: '{{ index . "OP_SERVICE_ACCOUNT_TOKEN" }}'
        TF_TOKEN_app_terraform_io: '{{ index . "TF_TOKEN_app_terraform_io" }}'
  dataFrom:
    - extract:
        key: claude-code

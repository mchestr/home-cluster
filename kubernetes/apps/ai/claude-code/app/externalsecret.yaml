# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-code
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: claude-code-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GITHUB_TOKEN: "{{ .GITHUB_TOKEN }}"
        HASS_TOKEN: "{{ .HASS_TOKEN }}"
        talosconfig: "{{ .TALOSCONFIG }}"
        # task terraform:* reads these instead of calling op.
        CLOUDFLARE_TERRAFORM_TOKEN: "{{ .CLOUDFLARE_TERRAFORM_TOKEN }}"
        OP_CONNECT_TOKEN: "{{ .OP_CONNECT_TOKEN }}"
        # Optional (index returns "" for a missing field).
        TF_TOKEN_app_terraform_io: '{{ index . "TF_TOKEN_app_terraform_io" }}'
  data:
    - secretKey: CLOUDFLARE_TERRAFORM_TOKEN
      remoteRef:
        key: cloudflare
        property: CLOUDFLARE_TERRAFORM_TOKEN
    - secretKey: OP_CONNECT_TOKEN
      remoteRef:
        key: 1password
        property: OP_CONNECT_TOKEN
  dataFrom:
    - extract:
        key: claude-code

# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-code
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: claude-code-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Fine-grained PAT for mchestr/home-cluster (contents + pull requests
        # read/write); gh and git push authenticate from it.
        GITHUB_TOKEN: "{{ .GITHUB_TOKEN }}"
        # Contents of the admin talosconfig (talosctl access to m0/m1/m2).
        talosconfig: "{{ .TALOSCONFIG }}"
  dataFrom:
    - extract:
        key: claude-code

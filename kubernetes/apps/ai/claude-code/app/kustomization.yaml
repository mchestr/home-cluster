# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - files:
      - ./resources/CLAUDE.md
      - ./resources/entrypoint.sh
      - ./resources/install-tools.sh
      - ./resources/kubeconfig.yaml
      - ./resources/log-filter.pl
      - ./resources/tools.env
    name: claude-code-scripts
generatorOptions:
  # Plain shell: keep Flux postBuild from treating $VARS as substitutions.
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  disableNameSuffixHash: true
resources:
  - ./externalsecret.yaml
  - ./pvc.yaml
  - ./rbac.yaml
  - ./networkpolicy.yaml
  - ./helmrelease.yaml

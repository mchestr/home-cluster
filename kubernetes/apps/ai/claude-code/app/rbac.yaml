---
# Same access as the admin kubeconfig used from the Mac, so remote sessions can
# fix anything a local one can. The guard is the permission mode instead of
# RBAC: Remote Control runs in default mode, so every tool call that is not
# allowlisted in the repo's .claude/settings.json waits for approval on the
# phone/claude.ai.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: &app claude-code
  labels:
    app.kubernetes.io/instance: *app
    app.kubernetes.io/name: *app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: *app
    namespace: ai

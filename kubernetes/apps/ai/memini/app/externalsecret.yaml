# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memini
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: memini-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Bearer token for /v1 and /mcp. Store it in a 1Password item named "memini".
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
        # memini's client key for cliproxyapi (field MEMINI_CLIENT_KEY in the
        # 1Password item "cliproxyapi"). Only this field is read from that item.
        MEMINI_LLM_API_KEY: "{{ .MEMINI_CLIENT_KEY }}"
  data:
    - secretKey: MEMINI_CLIENT_KEY
      remoteRef:
        key: cliproxyapi
        property: MEMINI_CLIENT_KEY
  dataFrom:
    - extract:
        key: memini

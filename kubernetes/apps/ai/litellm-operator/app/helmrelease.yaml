---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app litellm-operator
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: *app
  maxHistory: 2
  values:
    controller:
      leaderElection:
        enabled: true
    webhook:
      enabled: true
    # No local llmkube backend in this cluster — chat is routed to a hosted
    # provider, so don't auto-register llmkube InferenceServices as models.
    llmkube:
      autoRegister: false
    # The operator caches every Secret cluster-wide, and Helm release secrets
    # alone are ~40MiB; bursts of Helm upgrades OOMKilled it at 128Mi.
    env:
      - name: GOMEMLIMIT
        value: 200MiB
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 256Mi

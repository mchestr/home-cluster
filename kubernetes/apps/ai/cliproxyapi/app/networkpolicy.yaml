---
# Only litellm calls CLIProxyAPI. It has no HTTPRoute.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cliproxyapi
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cliproxyapi
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 8317
          protocol: TCP

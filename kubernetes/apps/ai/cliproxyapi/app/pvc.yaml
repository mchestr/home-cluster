---
# Holds the Codex OAuth credential (auth-dir). No VolSync backup: if it is lost,
# run the device login again (see the README).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cliproxyapi
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
  storageClassName: ceph-block

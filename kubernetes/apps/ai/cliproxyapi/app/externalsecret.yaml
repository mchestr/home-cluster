# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cliproxyapi
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cliproxyapi-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # The whole configuration is rendered here because CLIProxyAPI reads
        # its client keys from config.yaml only.
        config.yaml: |
          config-version: 8
          server:
            port: 8317
          management:
            # Empty disables the Management API and its web panel.
            secret-key: ""
            disable-control-panel: true
          access:
            api-keys:
              # Client key that litellm presents (litellm-secret has the same value).
              - "{{ .CLIPROXYAPI_API_KEY }}"
          oauth:
            auth-dir: /data/auths
          observability:
            logs:
              debug: false
              logging-to-file: false
              request-log: false
  dataFrom:
    # Field CLIPROXYAPI_API_KEY in the 1Password item named "litellm".
    - extract:
        key: litellm

# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cliproxyapi
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cliproxyapi-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # The whole configuration is rendered here because CLIProxyAPI reads
        # its keys from config.yaml only. Clients see only the aliases below
        # (and the Codex models after the device login).
        config.yaml: |
          config-version: 8
          server:
            port: 8317
          management:
            # Empty disables the Management API and its web panel.
            secret-key: ""
            disable-control-panel: true
          access:
            # One client key per app, so that you can revoke one alone.
            api-keys:
              - "{{ .MEMINI_CLIENT_KEY }}"
              - "{{ .SILO_CLIENT_KEY }}"
          routing:
            retry:
              request-retry: 3
          upstream:
            claude:
              # Send the client's own system prompt. The default replaces it
              # with the Claude Code CLI disguise.
              disable-claude-cloak-mode: true
              disable-cloaking-model-list: true
          api-keys:
            openai-compatibility:
              - name: openrouter
                base-url: https://openrouter.ai/api/v1
                keys:
                  - api-key: "{{ .OPENROUTER_API_KEY }}"
                models:
                  # memini (MEMINI_LLM_MODEL=memini-chat). A repeated alias is a
                  # pool: requests alternate, and a failed one moves to the next.
                  - name: qwen/qwen3-14b
                    alias: memini-chat
            claude:
              - name: anthropic
                keys:
                  - api-key: "{{ .ANTHROPIC_API_KEY }}"
                    cloak:
                      mode: never
                models:
                  # Silo subtitle and description translation (Admin > Integrations > AI).
                  - name: claude-opus-5-5
                    alias: silo-translate
                  # About 40x less per token. Type this name in Silo to switch.
                  - name: claude-haiku-5-5
                    alias: silo-translate-fast
          oauth:
            auth-dir: /data/auths
          observability:
            logs:
              debug: false
              logging-to-file: false
              request-log: false
  data:
    # Only these fields are read from the 1Password item "cliproxyapi".
    - { secretKey: MEMINI_CLIENT_KEY, remoteRef: { key: cliproxyapi, property: MEMINI_CLIENT_KEY } }
    - { secretKey: SILO_CLIENT_KEY, remoteRef: { key: cliproxyapi, property: SILO_CLIENT_KEY } }
    - { secretKey: OPENROUTER_API_KEY, remoteRef: { key: cliproxyapi, property: OPENROUTER_API_KEY } }
    - { secretKey: ANTHROPIC_API_KEY, remoteRef: { key: cliproxyapi, property: ANTHROPIC_API_KEY } }

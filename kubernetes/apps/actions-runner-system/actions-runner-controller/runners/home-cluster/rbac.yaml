---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: home-cluster-runner
---
# What the runner's container hook needs in its own namespace to run `container:` jobs
# and docker:// steps (the role the chart would create for its own ServiceAccount).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: home-cluster-runner-hook
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: home-cluster-runner-hook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: home-cluster-runner-hook
subjects:
  - kind: ServiceAccount
    name: home-cluster-runner
---
# `talosctl image pull` (the Image Pull jobs in ci.yaml).
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: home-cluster-runner
spec:
  roles: ["os:admin"]

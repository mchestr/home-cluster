---
# Ferry Watch's two login roles, one per process (ferry-web, ferry-control); the database owner stays
# components/cnpg's. The same passwords reach the app through its own ExternalSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name ferrywatch-web-role
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: ferrywatch_web
        password: "{{ .ferrywatch_web_password }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name ferrywatch-control-role
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: ferrywatch_control
        password: "{{ .ferrywatch_control_password }}"
  dataFrom:
    - extract:
        key: cloudnative-pg

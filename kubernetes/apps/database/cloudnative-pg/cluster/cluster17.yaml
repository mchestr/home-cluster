---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres17
spec:
  instances: 3
  # A -system- image, because only those ship the barman that spec.backup.barmanObjectStore runs.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-system-trixie@sha256:ca4e429e2220e3f6ccbb81a87f783369312a1dcc48793266cd297ca8f8724e47
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  storage:
    size: 20Gi
    storageClass: openebs-hostpath
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  postgresql:
    parameters:
      max_connections: "400"
      max_locks_per_transaction: "128"
      shared_buffers: 256MB
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
  resources:
    requests:
      cpu: 500m
    limits:
      memory: 6Gi
  monitoring:
    enablePodMonitor: true

  # Login roles beyond each app's owner role (components/cnpg). Passwords: ../roles/externalsecret.yaml.
  managed:
    roles:
      # Ferry Watch's, deleted: CNPG ignores a role that isn't listed, so absent is what makes it drop them (once
      # the ferrywatch database is gone). Remove these two entries afterwards (waitlist README, Phase 2 step 8).
      - name: ferrywatch_web
        ensure: absent
      - name: ferrywatch_control
        ensure: absent
      # Waitlist: one role per process. Its db Job grants each exactly its tables (waitlist repo,
      # src/waitlist/control/db.py).
      - name: waitlist_web
        comment: Waitlist waitlist-web
        ensure: present
        login: true
        connectionLimit: 20
        passwordSecret:
          name: waitlist-web-role
      - name: waitlist_control
        comment: Waitlist waitlist-control
        ensure: present
        login: true
        connectionLimit: 20
        passwordSecret:
          name: waitlist-control-role

  backup:
    retentionPolicy: 30d
    barmanObjectStore: &barmanObjectStore
      data:
        compression: bzip2
      wal:
        compression: bzip2
        maxParallel: 8
      destinationPath: s3://cloudnative-pg/
      endpointURL: https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
      # Note: serverName version needs to be incremented
      # when recovering from an existing cnpg cluster
      serverName: &currentCluster postgres17-v1
      s3Credentials:
        accessKeyId:
          name: cloudnative-pg-secret
          key: aws-access-key-id
        secretAccessKey:
          name: cloudnative-pg-secret
          key: aws-secret-access-key

  # Note: previousCluster needs to be set to the name of the previous
  # cluster when recovering from an existing cnpg cluster
  # bootstrap:
  #   recovery:
  #     source: &previousCluster postgres17-v1
  # Note: externalClusters is needed when recovering from an existing cnpg cluster
  # externalClusters:
  #   - name: *previousCluster
  #     barmanObjectStore:
  #       <<: *barmanObjectStore
  #       serverName: *previousCluster

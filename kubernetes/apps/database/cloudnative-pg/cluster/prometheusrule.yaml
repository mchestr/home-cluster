---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudnative-pg-rules
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: cloudnative-pg.rules
      rules:
        - alert: LongRunningTransaction
          annotations:
            description: Pod {{ $labels.pod }} is taking more than 5 minutes (300 seconds) for a query.
            summary: A query is taking longer than 5 minutes.
          expr: |-
            cnpg_backends_max_tx_duration_seconds > 300
          for: 1m
          labels:
            severity: warning
        - alert: BackendsWaiting
          annotations:
            description: Pod {{ $labels.pod }} has been waiting for longer than 5 minutes
            summary: If a backend is waiting for longer than 5 minutes
          expr: |-
            cnpg_backends_waiting_total > 300
          for: 1m
          labels:
            severity: warning
        - alert: PGDatabase
          annotations:
            description: Over 300,000,000 transactions from frozen xid on pod {{ $labels.pod }}
            summary: Number of transactions from the frozen XID to the current one
          expr: |-
            cnpg_pg_database_xid_age > 300000000
          for: 1m
          labels:
            severity: warning
        - alert: PGReplication
          annotations:
            description: Standby is lagging behind by over 300 seconds (5 minutes)
            summary: The standby is lagging behind the primary
          expr: |-
            cnpg_pg_replication_lag > 300
          for: 1m
          labels:
            severity: warning
        - alert: LastFailedArchiveTime
          annotations:
            description: Archiving failed for {{ $labels.pod }}
            summary: Checks the last time archiving failed. Will be < 0 when it has not failed.
          expr: |-
            (cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time) > 1
          for: 1m
          labels:
            severity: warning
        - alert: DatabaseDeadlockConflicts
          annotations:
            description: There are over 10 deadlock conflicts in {{ $labels.pod }}
            summary: Checks the number of database conflicts
          expr: |-
            cnpg_pg_stat_database_deadlocks > 10
          for: 1m
          labels:
            severity: warning
        - alert: ReplicaFailingReplication
          annotations:
            description: Replica {{ $labels.pod }} is failing to replicate
            summary: Checks if the replica is failing to replicate
          expr: |-
            cnpg_pg_replication_in_recovery > cnpg_pg_replication_is_wal_receiver_up
          for: 1m
          labels:
            severity: warning
        - alert: CNPGBackupTooOld
          annotations:
            description: The last base backup of cluster {{ $labels.cluster }} is {{ $value | humanizeDuration }} old. The ScheduledBackup runs daily.
            summary: The CNPG base backup is older than 30 hours.
          expr: |-
            time() - max by (namespace, cluster) (
              label_replace(cnpg_collector_last_available_backup_timestamp > 0, "cluster", "$1", "pod", "(.+)-[0-9]+")
            ) > 30 * 3600
          for: 1h
          labels:
            severity: critical
        - alert: CNPGBackupFailed
          annotations:
            description: The last base backup of cluster {{ $labels.cluster }} failed and no backup has completed since.
            summary: The CNPG base backup failed.
          expr: |-
            max by (namespace, cluster) (
              label_replace(cnpg_collector_last_failed_backup_timestamp, "cluster", "$1", "pod", "(.+)-[0-9]+")
            ) > max by (namespace, cluster) (
              label_replace(cnpg_collector_last_available_backup_timestamp, "cluster", "$1", "pod", "(.+)-[0-9]+")
            )
          for: 15m
          labels:
            severity: warning
        - alert: PgDumpBackupStale
          annotations:
            description: CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has had no successful run for {{ $value | humanizeDuration }}. It runs every 4 hours.
            summary: No successful pg_dump backup in 9 hours, or none since the CronJob was created.
          expr: |-
            (
              time() - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{cronjob=~".+-pg-backups"})
              > 9 * 3600
            )
            or
            (
              time() - max by (namespace, cronjob) (kube_cronjob_created{cronjob=~".+-pg-backups"}) > 9 * 3600
              unless on (namespace, cronjob) kube_cronjob_status_last_successful_time{cronjob=~".+-pg-backups"}
            )
          for: 30m
          labels:
            severity: warning

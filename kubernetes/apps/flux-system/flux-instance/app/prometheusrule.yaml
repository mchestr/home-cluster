---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux-instance-rules
  namespace: flux-system
spec:
  groups:
    - name: flux-instance.rules
      rules:
        - alert: FluxInstanceAbsent
          expr: absent(flux_instance_info{exported_namespace="flux-system", name="flux"})
          for: 15m
          annotations:
            summary: Flux instance metric is missing
            description: |
              The flux_instance_info metric for the Flux instance in namespace {{ $labels.exported_namespace }} is not available.
          labels:
            severity: critical
        - alert: FluxInstanceNotReady
          expr: flux_instance_info{exported_namespace="flux-system", name="flux", ready!="True"}
          for: 15m
          annotations:
            summary: Flux instance {{ $labels.name }} is not ready
            description: |
              The Flux instance in namespace {{ $labels.exported_namespace }} is not ready.
              Reason: {{ $labels.reason }}
          labels:
            severity: critical
        # Drop the ready, reason and revision labels: they change while an object retries and would reset the for timer
        - alert: FluxResourceNotReady
          expr: max by (exported_namespace, kind, name) (flux_resource_info{ready!="True", suspended="False"})
          for: 15m
          annotations:
            summary: Flux {{ $labels.kind }} {{ $labels.name }} is not ready
            description: |
              The Flux {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} has not been ready for 15 minutes.
          labels:
            severity: warning
        - alert: FluxResourceSuspended
          expr: max by (exported_namespace, kind, name) (flux_resource_info{suspended="True"})
          for: 24h
          annotations:
            summary: Flux {{ $labels.kind }} {{ $labels.name }} is suspended
            description: |
              The Flux {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} has been suspended for 24 hours.
          labels:
            severity: warning

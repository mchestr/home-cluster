---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: zigbee2mqtt-alerts
  labels:
    vmalert-logs.io/enabled: "true"
spec:
  groups:
    - name: &name ZigbeeMQTTUnreachable
      type: vlogs
      interval: 5m
      rules:
        - alert: *name
          expr: '"Not connected to MQTT server" | filter app := "zigbee2mqtt" | stats by (app) count() rows | filter rows :> 0'
          labels:
            severity: warning
          annotations:
            description: '{{ $labels.app }} is unable to reach MQTT'

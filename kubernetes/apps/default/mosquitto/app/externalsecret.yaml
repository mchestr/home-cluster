---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app mosquitto
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mosquitto-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Plaintext user:password, hashed by the init container (mosquitto_passwd -U)
        mosquitto_pwd: |
          {{ .MOSQUITTO_MQTT_USERNAME }}:{{ .MOSQUITTO_MQTT_PASSWORD }}
  dataFrom:
    - extract:
        key: *app

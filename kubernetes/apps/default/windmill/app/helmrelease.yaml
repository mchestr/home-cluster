---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: windmill
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: windmill
  maxHistory: 2
  upgrade:
    # Runs DB migrations on upgrade; don't roll back onto a migrated schema
    strategy:
      name: RetryOnFailure
  values:
    windmill:
      baseDomain: windmill.chestr.dev
      baseProtocol: https
      appReplicas: 2
      lspReplicas: 1
      multiplayerReplicas: 0
      app:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          - name: 01-init-db
            image: ghcr.io/home-operations/postgres-init:18
            envFrom: &envFrom
              - secretRef:
                  name: windmill-initdb-secret
          - name: init-grants
            image: ghcr.io/home-operations/postgres-init:18
            command:
              - /bin/bash
              - -c
              - |
                #!/bin/bash

                set -o errexit
                set -o nounset

                /var/run/grants.sh
            envFrom: *envFrom
            volumeMounts:
              - name: grants
                readOnly: true
                subPath: grants.sh
                mountPath: /var/run/grants.sh
        volumes:
          - name: grants
            configMap:
              name: windmill-grants
              defaultMode: 509
      workerGroups:
        - name: default
          # The standard image dropped Deno; -full still ships it (and more runtimes)
          # so the existing Deno scripts keep running. Tag follows the chart appVersion.
          image: ghcr.io/windmill-labs/windmill-full
          replicas: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
        - name: native
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
    ingress:
      enabled: false
    postgresql:
      enabled: false
    minio:
      enabled: false
  valuesFrom:
    - kind: Secret
      name: windmill-pguser-secret
      valuesKey: uri
      targetPath: windmill.databaseUrl

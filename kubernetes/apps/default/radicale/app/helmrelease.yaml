---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app radicale
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    defaultPodOptions:
      # 2999 is the image's radicale user. As root, the entrypoint chowns /data to it and drops to
      # it; as 2999 it skips both and starts radicale directly.
      securityContext:
        runAsNonRoot: true
        runAsUser: 2999
        runAsGroup: 2999
        fsGroup: 2999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    controllers:
      radicale:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: tomsquest/docker-radicale
              tag: 3.9.0.0
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 15m
                memory: 79M
              limits:
                memory: 79M


    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 5232

    route:
      app:
        hostnames: ["cal.chestr.dev"]
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: radicale.png
          gethomepage.dev/name: Calendar
          gethomepage.dev/group: System
        parentRefs:
          - name: envoy-external
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port

    persistence:
      data:
        existingClaim: *app
      config:
        type: configMap
        name: radicale-config
        globalMounts:
          - path: /config/config
            subPath: config.cfg
      auth:
        type: secret
        name: radicale
        globalMounts:
          - path: /config/users
            subPath: users

    networkpolicies:
      # Only the external gateway reaches this pod.
      app:
        controller: radicale
        policyTypes: [Ingress]
        rules:
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: networking
                  podSelector:
                    matchLabels:
                      gateway.envoyproxy.io/owning-gateway-name: envoy-external
              ports:
                - protocol: TCP
                  port: *port
      # Cross-node gateway traffic is SNATed to the node, which Cilium sees as the
      # kube-apiserver entity on this all-control-plane cluster (see waitlist).
      cilium:
        type: cilium
        controller: radicale
        ingress:
          - fromEntities: [kube-apiserver]
            toPorts:
              - ports:
                  - port: "5232"
                    protocol: TCP

---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: frigate-alerts
  labels:
    vmalert-logs.io/enabled: "true"
spec:
  groups:
    - name: &name FrigateMQTTUnreachable
      type: vlogs
      interval: 5m
      rules:
        - alert: *name
          expr: '("MQTT disconnected" or "Unable to connect to MQTT server") | filter app := "frigate" | stats by (app) count() rows | filter rows :> 0'
          labels:
            severity: warning
          annotations:
            description: '{{ $labels.app }} is unable to reach MQTT'

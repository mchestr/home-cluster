---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: zwave-js-ui-alerts
  labels:
    vmalert-logs.io/enabled: "true"
spec:
  groups:
    - name: &name zWaveMQTTUnreachable
      type: vlogs
      interval: 5m
      rules:
        - alert: *name
          expr: '"Mqtt client error" | filter app := "zwave-js-ui" | stats by (app) count() rows | filter rows :> 0'
          labels:
            severity: warning
          annotations:
            description: '{{ $labels.app }} is unable to reach MQTT'

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: amazon-ses-mikeflix-lol
spec:
  endpoints:
    - dnsName: cwneivib4lt2ayacacl36nskexxvmlbw._domainkey.mikeflix.lol
      recordType: CNAME
      targets:
        - cwneivib4lt2ayacacl36nskexxvmlbw.dkim.amazonses.com
      providerSpecific:
        - name: cloudflare/proxied
          value: "false"
    - dnsName: 4dqmwq77fj7kn4wxwkwgu26qsfkkv5mg._domainkey.mikeflix.lol
      recordType: CNAME
      targets:
        - 4dqmwq77fj7kn4wxwkwgu26qsfkkv5mg.dkim.amazonses.com
      providerSpecific:
        - name: cloudflare/proxied
          value: "false"
    - dnsName: rpx7mosliwbdwdguqoc23pdlmchedhql._domainkey.mikeflix.lol
      recordType: CNAME
      targets:
        - rpx7mosliwbdwdguqoc23pdlmchedhql.dkim.amazonses.com
      providerSpecific:
        - name: cloudflare/proxied
          value: "false"
    # SES custom MAIL FROM domain. SES must set mail.mikeflix.lol as the MAIL FROM domain of the identity.
    - dnsName: mail.mikeflix.lol
      recordType: MX
      targets:
        # external-dns needs the priority in front of the host.
        - 10 feedback-smtp.us-west-2.amazonses.com
    - dnsName: mail.mikeflix.lol
      recordType: TXT
      targets:
        - v=spf1 include:amazonses.com ~all
    - dnsName: _dmarc.mikeflix.lol
      recordType: TXT
      targets:
        - v=DMARC1; p=none;

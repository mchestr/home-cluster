---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app home-assistant
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      home-assistant:
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name":"multus-iot",
                "namespace": "networking",
                "ips": ["10.0.10.250/24"]
              }]
          hostAliases:
            - ip: "10.0.10.250"
              hostnames:
                - "home-assistant"
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          copy-soco-fix:
            image:
              repository: busybox
              tag: latest
            command:
              - sh
              - -c
              - |
                mkdir -p /config/custom_components/soco_ip_fix
                cp /soco-config/manifest.json /config/custom_components/soco_ip_fix/
                cp /soco-config/__init__.py /config/custom_components/soco_ip_fix/

        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.9.3
            envFrom:
              - secretRef:
                  name: home-assistant-secret
            env:
              TZ: America/Vancouver
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /manifest.json
                    port: &port 8123
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /manifest.json
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 30

          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.139.1@sha256:0c067c3cf09ed1830ce282387826be8feefef8a5828f462791c2df3f1007ee17
            env:
              TZ: America/Vancouver
              PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-secret
                    key: CODE_SERVER_PASSWORD
            args:
              - --auth
              - password
              - --user-data-dir
              - /config/.vscode
              - --extensions-dir
              - /config/.vscode/extensions
              - --port
              - "12321"
              - /config

    defaultPodOptions:
      hostname: home-assistant
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
          sonos:
            port: 1400
          codeserver:
            port: &codeserverPort 12321

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.chestr.dev"
          - home.chestr.dev
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Home
          gethomepage.dev/name: Home Assistant
          gethomepage.dev/icon: home-assistant.png
        parentRefs:
          - name: envoy-external
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
      # Self-hosted code-server for editing HA config. It is a shell with write
      # access to the config, so it must stay on envoy-internal ONLY (behind
      # Authelia 2FA + CODE_SERVER_PASSWORD). Never expose it on envoy-external.
      codeserver:
        hostnames:
          - home-assistant-code.chestr.dev
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *codeserverPort

    # Custom component to fix Sonos soco library binding to pod IP instead of Multus IP.
    # Sets soco.config.EVENT_LISTENER_IP so Sonos speakers can reach HA for event callbacks.
    configMaps:
      soco-config:
        data:
          manifest.json: |
            {
              "domain": "soco_ip_fix",
              "name": "Soco IP Fix",
              "version": "1.0.0",
              "codeowners": [],
              "dependencies": [],
              "requirements": []
            }
          __init__.py: |
            import soco.config
            soco.config.EVENT_LISTENER_IP = "10.0.10.250"

            async def async_setup(hass, config):
                return True

    persistence:
      config:
        existingClaim: *app
        advancedMounts:
          home-assistant:
            copy-soco-fix:
              - path: /config
            app:
              - path: /config
              - path: /.vscode-server
              - path: /.vscode
            codeserver:
              - path: /config

      soco-config:
        type: configMap
        name: home-assistant
        advancedMounts:
          home-assistant:
            copy-soco-fix:
              - path: /soco-config

      deploykey:
        type: secret
        name: home-assistant-deploykey-secret
        defaultMode: 0600
        advancedMounts:
          home-assistant:
            codeserver:
              - path: /home/coder/.ssh

    networkpolicies:
      home-assistant:
        controller: home-assistant

        policyTypes:
          - Ingress

        rules:
          ingress:
            # External gateway may only reach Home Assistant itself
            - from:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/component: proxy
                      app.kubernetes.io/managed-by: envoy-gateway
                      app.kubernetes.io/name: envoy
                      gateway.envoyproxy.io/owning-gateway-name: envoy-external
                  namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: networking
              ports:
                - protocol: TCP
                  port: *port
            # code-server is internal-only
            - from:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/component: proxy
                      app.kubernetes.io/managed-by: envoy-gateway
                      app.kubernetes.io/name: envoy
                      gateway.envoyproxy.io/owning-gateway-name: envoy-internal
                  namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: networking
              ports:
                - protocol: TCP
                  port: *codeserverPort

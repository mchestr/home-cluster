---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app ferry-watch
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ferry-watch-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        BCF_USER: "{{ .BCF_USER }}"
        BCF_PASS: "{{ .BCF_PASS }}"
        PUSHOVER_USER_KEY: "{{ .PUSHOVER_USER_KEY }}"
        PUSHOVER_TOKEN: "{{ .PUSHOVER_GATUS_TOKEN }}"
  dataFrom:
    - extract:
        key: *app
    - extract:
        key: pushover

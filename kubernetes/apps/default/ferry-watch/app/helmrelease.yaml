---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ferry-watch
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  values:
    controllers:
      ferry-watch:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/mchestr/ferry-watch
              tag: 0.5.1
            env:
              TZ: America/Vancouver
              # Linked from the "in your cart" alert: KasmVNC's view of the browser holding the cart,
              # resized to fit whatever device opens it.
              BCF_VNC_URL: https://ferry.chestr.dev/vnc/vnc.html?autoconnect=1&resize=remote&path=vnc/websockify
            envFrom:
              - secretRef:
                  name: ferry-watch-secret
            probes:
              # /healthz fails if the watch loop stops or stalls, so a stuck watcher gets restarted.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8765
                  periodSeconds: 2
                  failureThreshold: 30
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 15
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                # One browser with a session (tab + cookies) per watched trip, up to six.
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]

    defaultPodOptions:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        runAsNonRoot: true
        fsGroupChangePolicy: OnRootMismatch
        # Chromium's own sandbox is off (Playwright's default without user namespaces), so the pod
        # boundary is the sandbox: non-root, no capabilities, read-only root, RuntimeDefault seccomp.
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
          vnc:
            port: &vnc 6080

    route:
      app:
        hostnames:
          - ferry.chestr.dev
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Home
          gethomepage.dev/name: Ferry Watch
          gethomepage.dev/icon: mdi-ferry
        # Internal only: the remote viewer has no password and relies on Authelia in front of it
        # (and networkpolicy.yaml, so nothing else in the cluster can reach the pod directly).
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /vnc
            backendRefs:
              - name: *app
                port: *vnc
          - backendRefs:
              - name: *app
                port: *port

    persistence:
      config:
        existingClaim: *app
      # The root filesystem is read-only: X sockets, Chromium's profile and caches live here.
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm

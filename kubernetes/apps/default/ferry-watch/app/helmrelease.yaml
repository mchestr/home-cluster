---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ferry-watch
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  values:
    controllers:
      ferry-watch:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/mchestr/ferry-watch
              tag: 0.2.0
            env:
              TZ: America/Vancouver
              # Linked from the "in your cart" notification: the noVNC view of the cart browser.
              BCF_VNC_URL: https://ferry.chestr.dev/vnc/vnc.html?autoconnect=1&resize=scale&path=vnc/websockify
            envFrom:
              - secretRef:
                  name: ferry-watch-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8765
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 300Mi
              limits:
                # A check and a cart browser can run at the same time (two Chromiums).
                memory: 3Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]

    defaultPodOptions:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        runAsNonRoot: true
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
          vnc:
            port: &vnc 6080

    route:
      app:
        hostnames:
          - ferry.chestr.dev
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Home
          gethomepage.dev/name: Ferry Watch
          gethomepage.dev/icon: mdi-ferry
        # Internal only: noVNC has no password and relies on Authelia in front of it.
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /vnc
            backendRefs:
              - name: *app
                port: *vnc
          - backendRefs:
              - name: *app
                port: *port

    persistence:
      config:
        existingClaim: *app
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15151C"/>
      <stop offset="0.55" stop-color="#0B0B0F"/>
      <stop offset="1" stop-color="#07070A"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.18" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#E4202B" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#6E0A11" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#E4202B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#3A1C2A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3A1C2A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4D56" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FF4D56" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    
  <linearGradient id="m-stem" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FF4D56"/>
    <stop offset="0.55" stop-color="#E4202B"/>
    <stop offset="1" stop-color="#9A0F18"/>
  </linearGradient>
  <linearGradient id="m-back" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9A0F18"/>
    <stop offset="1" stop-color="#6E0A11"/>
  </linearGradient>
  <linearGradient id="m-front" x1="1" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FF4D56"/>
    <stop offset="0.6" stop-color="#E4202B"/>
    <stop offset="1" stop-color="#9A0F18"/>
  </linearGradient>
  <filter id="m-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
    <feOffset dx="-14" dy="10" result="o"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  </defs>
  <rect width="2560" height="1440" fill="url(#bg)"/>
  <rect width="2560" height="1440" fill="url(#glow2)"/>
  <rect width="2560" height="1440" fill="url(#glow1)"/>
  <!-- projector beams -->
  <polygon points="128,1440 1587.2,0 1996.8000000000002,0 768,1440" fill="url(#beam)" filter="url(#soft)"/>
  <polygon points="972.8,1440 2355.2000000000003,0 2560,0 1408,1440" fill="url(#beam)" filter="url(#soft)" opacity="0.6"/>
  <!-- large faint ribbon M, bleeding off the right edge -->
  <g transform="translate(1199.2, -252) scale(1.944)" opacity="0.14">
  <g id="m">
    <rect x="170" y="200" width="160" height="600" fill="url(#m-stem)"/>
    <rect x="670" y="200" width="160" height="600" fill="url(#m-stem)"/>
    <polygon points="170,200 330,200 580,800 420,800" fill="url(#m-back)"/>
    <polygon points="670,200 830,200 580,800 420,800" fill="url(#m-front)" filter="url(#m-shadow)"/>
  </g></g>
  <rect width="2560" height="1440" fill="url(#vignette)"/>
</svg>
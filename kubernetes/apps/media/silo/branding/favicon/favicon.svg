<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
  <linearGradient id="t-tile" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1B1B21"/>
    <stop offset="1" stop-color="#0D0D11"/>
  </linearGradient>
  <radialGradient id="t-glow" cx="0.5" cy="0.95" r="0.8">
    <stop offset="0" stop-color="#E4202B" stop-opacity="0.28"/>
    <stop offset="1" stop-color="#E4202B" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="m-stem" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FF4D56"/>
    <stop offset="0.55" stop-color="#E4202B"/>
    <stop offset="1" stop-color="#9A0F18"/>
  </linearGradient>
  <linearGradient id="m-back" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9A0F18"/>
    <stop offset="1" stop-color="#6E0A11"/>
  </linearGradient>
  <linearGradient id="m-front" x1="1" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FF4D56"/>
    <stop offset="0.6" stop-color="#E4202B"/>
    <stop offset="1" stop-color="#9A0F18"/>
  </linearGradient>
  <filter id="m-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
    <feOffset dx="-14" dy="10" result="o"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter></defs>
  <rect width="1000" height="1000" rx="200" fill="url(#t-tile)"/>
  <rect width="1000" height="1000" rx="200" fill="url(#t-glow)"/>
  
  <g id="m">
    <rect x="170" y="200" width="160" height="600" fill="url(#m-stem)"/>
    <rect x="670" y="200" width="160" height="600" fill="url(#m-stem)"/>
    <polygon points="170,200 330,200 580,800 420,800" fill="url(#m-back)"/>
    <polygon points="670,200 830,200 580,800 420,800" fill="url(#m-front)" filter="url(#m-shadow)"/>
  </g>
</svg>
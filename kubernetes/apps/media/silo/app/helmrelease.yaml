---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app silo
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  upgrade:
    # Runs DB migrations on upgrade; do not roll back onto a migrated schema
    strategy:
      name: RetryOnFailure
  values:
    controllers:
      silo:
        # Two API servers share the database, Dragonfly and the CephFS config volume.
        # Streams survive the loss of one pod: Silo rebuilds a playback session from
        # the client's stream token on whichever replica gets the next request.
        replicas: 2
        strategy: RollingUpdate
        rollingUpdate:
          surge: 1
          unavailable: 0
        # A node drain keeps one pod up.
        podDisruptionBudget:
          minAvailable: 1
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18"
            envFrom:
              - secretRef:
                  name: silo-initdb-secret
        containers:
          app:
            image:
              repository: ghcr.io/silo-server/silo-server
              tag: build-1956@sha256:53c7d17ce37c405c1a74f6f84e306e0c2d6f75a19f4b18b1bd94d97c15e6e263
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: America/Vancouver
              PORT: &port 8080
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: silo-pguser-secret
                    key: uri
              # Silo must not run ALTER SYSTEM on a shared cluster.
              POSTGRES_TUNE: "off"
              REDIS_URL: redis://silo-dragonfly.media.svc.cluster.local:6379
              # On SIGTERM the pod fails readiness and keeps serving for this long, so the
              # gateway moves new requests to the other replica before the listeners close.
              SILO_SHUTDOWN_DELAY: 10s
              # Prometheus metrics. The listener has no authentication, so it stays on the pod network.
              SILO_METRICS_LISTEN: 0.0.0.0:9091
            envFrom:
              - secretRef:
                  name: silo-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/ready
                    port: *port
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              # Silo migrates its database before it listens, for up to 20 minutes.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 120
            # The image starts s6 as root, which then runs Silo as PUID. It writes to
            # its root filesystem and needs the default capabilities to change account.
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              requests:
                gpu.intel.com/i915: 1
                cpu: 100m
                memory: 1Gi
              limits:
                gpu.intel.com/i915: 1
                memory: 8Gi

    defaultPodOptions:
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      # One replica per node, so a node reboot takes down at most one.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: silo
              topologyKey: kubernetes.io/hostname
      # Silo finishes in-flight requests before it stops: SILO_SHUTDOWN_DELAY plus 90s at least.
      terminationGracePeriodSeconds: 120

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
          metrics:
            port: 9091

    # The upstream rules in prometheusrule.yaml expect the job label "silo", which is the Service name.
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s

    route:
      app:
        hostnames: ["{{ .Release.Name }}.chestr.dev"]
        annotations:
          gatus.home-operations.com/enabled: "false"
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port

    persistence:
      config:
        existingClaim: silo-config
      initdb:
        type: configMap
        name: silo-initdb
        advancedMounts:
          silo:
            01-init-db:
              - path: /initdb
                readOnly: true
      media:
        type: nfs
        server: nebula.chestr.dev
        path: /var/nfs/shared/cluster/media
        globalMounts:
          - path: /mnt/media
            readOnly: true
      transcode:
        type: emptyDir
        globalMounts:
          - path: /tmp/silo-transcode
      downloads:
        type: emptyDir
        globalMounts:
          - path: /tmp/silo-download-artifacts

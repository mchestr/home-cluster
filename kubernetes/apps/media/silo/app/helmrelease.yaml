---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app silo
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  upgrade:
    # Runs DB migrations on upgrade; do not roll back onto a migrated schema
    strategy:
      name: RetryOnFailure
  values:
    controllers:
      silo:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/silo-server/silo-server
              tag: build-1919@sha256:b2e78645fca45846cdf344d022def67b5c7f802d4c413f10dc07e5256244cb12
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: America/Vancouver
              PORT: &port 8080
              ENABLE_REDIS: "true"
            envFrom:
              - secretRef:
                  name: silo-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/ready
                    port: *port
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              # Silo migrates its database before it listens, for up to 20 minutes.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 120
            # The image starts s6 as root, which then runs Silo as PUID, and PostgreSQL
            # and Redis as their own accounts. It writes to its root filesystem and
            # needs the default capabilities to change between these accounts.
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              requests:
                gpu.intel.com/i915: 1
                cpu: 100m
                memory: 1Gi
              limits:
                gpu.intel.com/i915: 1
                memory: 8Gi

    defaultPodOptions:
      # No fsGroup: PostgreSQL refuses a data directory that its group can write to.
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      # Silo finishes in-flight requests before PostgreSQL stops.
      terminationGracePeriodSeconds: 120

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    route:
      app:
        hostnames: ["{{ .Release.Name }}.chestr.dev"]
        annotations:
          gatus.home-operations.com/enabled: "false"
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port

    persistence:
      config:
        existingClaim: *app
      media:
        type: nfs
        server: nebula.chestr.dev
        path: /var/nfs/shared/cluster/media
        globalMounts:
          - path: /mnt/media
            readOnly: true
      transcode:
        type: emptyDir
        globalMounts:
          - path: /tmp/silo-transcode
      downloads:
        type: emptyDir
        globalMounts:
          - path: /tmp/silo-download-artifacts

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app silo
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  upgrade:
    # Runs DB migrations on upgrade; do not roll back onto a migrated schema
    strategy:
      name: RetryOnFailure
  values:
    controllers:
      silo:
        # Two API servers share the database, Dragonfly and the CephFS config volume.
        # Streams survive the loss of one pod: Silo rebuilds a playback session from
        # the client's stream token on whichever replica gets the next request.
        replicas: 2
        strategy: RollingUpdate
        rollingUpdate:
          surge: 1
          unavailable: 0
        # A node drain keeps one pod up.
        podDisruptionBudget:
          minAvailable: 1
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # One API replica per node, so a node reboot takes down at most one. The rule sits on
          # this controller only: on the Meilisearch pod it kept API pods off that node, so the
          # third node had no room for the surge pod and the rolling update stalled.
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: silo
                      app.kubernetes.io/controller: silo
                  topologyKey: kubernetes.io/hostname
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18"
            envFrom:
              - secretRef:
                  name: silo-initdb-secret
        containers:
          app:
            image:
              repository: ghcr.io/silo-server/silo-server
              tag: build-1966@sha256:c7b19fe7db6588d6e63c92d08a140c1566b6f94206a84fae1a14f8bec521bad5
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: America/Vancouver
              PORT: &port 8080
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: silo-pguser-secret
                    key: uri
              # Silo must not run ALTER SYSTEM on a shared cluster.
              POSTGRES_TUNE: "off"
              REDIS_URL: redis://silo-dragonfly.media.svc.cluster.local:6379
              # Typo-tolerant search. These three replace the search settings in the admin UI
              # on every start, and both replicas get the same values. Meilisearch needs REDIS_URL
              # for paged searches.
              SILO_SEARCH_PROVIDER: meilisearch
              SILO_MEILISEARCH_URL: http://silo-meilisearch.media.svc.cluster.local:7700
              SILO_MEILISEARCH_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: silo-meilisearch-secret
                    key: MEILI_MASTER_KEY
              # On SIGTERM the pod fails readiness and keeps serving for this long, so the
              # gateway moves new requests to the other replica before the listeners close.
              SILO_SHUTDOWN_DELAY: 10s
              # Prometheus metrics. The listener has no authentication, so it stays on the pod network.
              SILO_METRICS_LISTEN: 0.0.0.0:9091
            envFrom:
              - secretRef:
                  name: silo-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/ready
                    port: *port
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              # Silo migrates its database before it listens, for up to 20 minutes.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 120
            # The image starts s6 as root, which then runs Silo as PUID. It writes to
            # its root filesystem and needs the default capabilities to change account.
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              requests:
                gpu.intel.com/i915: 1
                cpu: 100m
                memory: 1Gi
              limits:
                gpu.intel.com/i915: 1
                memory: 8Gi

      meilisearch:
        # One instance: Meilisearch does not cluster. The index is rebuilt from the database
        # (Admin > Server > Search > Rebuild index), so it is not backed up.
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # The image has no USER and would run as root. The PVC is group-writable through fsGroup.
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              # Silo pins the same minor in its docker-compose.advanced.yml.
              repository: docker.io/getmeili/meilisearch
              tag: v1.54.3@sha256:e68913ab7d6f5b159529e472cfd362ce3c741fafd3c127961b2142abbe41b3c9
            env:
              MEILI_ENV: production
              MEILI_NO_ANALYTICS: "true"
              # Meilisearch refuses an index written by another version. With this set it
              # upgrades the index in place at start, so a Renovate bump needs no manual step.
              # If that upgrade fails, empty the silo-meilisearch PVC and Silo rebuilds the index.
              MEILI_UPGRADE_DB: "true"
              # Default is two thirds of the node's RAM, which ignores the container limit.
              MEILI_MAX_INDEXING_MEMORY: 1GiB
            envFrom:
              - secretRef:
                  name: silo-meilisearch-secret
            probes:
              liveness: &meiliprobe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &meiliport 7700
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *meiliprobe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *meiliport
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi

    defaultPodOptions:
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      # Silo finishes in-flight requests before it stops: SILO_SHUTDOWN_DELAY plus 90s at least.
      terminationGracePeriodSeconds: 120

    service:
      app:
        # With two Services the chart would name this one silo-app. The route, the
        # ServiceMonitor and the alert rules expect "silo".
        forceRename: *app
        controller: *app
        ports:
          http:
            port: *port
          metrics:
            port: 9091
      # Named silo-meilisearch. The master key is the only authentication, so it stays in-cluster.
      meilisearch:
        controller: meilisearch
        ports:
          http:
            port: *meiliport

    # The upstream rules in prometheusrule.yaml expect the job label "silo", which is the Service name.
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s

    route:
      app:
        hostnames: ["{{ .Release.Name }}.chestr.dev", mikeflix.lol]
        annotations:
          gatus.home-operations.com/enabled: "false"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: mdi-movie-open-play
          gethomepage.dev/name: Silo
          gethomepage.dev/group: Media
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port

    persistence:
      config:
        existingClaim: silo-config
        advancedMounts:
          silo:
            app:
              - path: /config
      meilisearch:
        existingClaim: silo-meilisearch
        advancedMounts:
          meilisearch:
            app:
              - path: /meili_data
      meilisearch-tmp:
        type: emptyDir
        advancedMounts:
          meilisearch:
            app:
              - path: /tmp
      initdb:
        type: configMap
        name: silo-initdb
        advancedMounts:
          silo:
            01-init-db:
              - path: /initdb
                readOnly: true
      # advancedMounts on every volume: the Meilisearch pod mounts only its own index.
      media:
        type: nfs
        server: nebula.chestr.dev
        path: /var/nfs/shared/cluster/media
        advancedMounts:
          silo:
            app:
              - path: /mnt/media
                readOnly: true
      transcode:
        type: emptyDir
        advancedMounts:
          silo:
            app:
              - path: /tmp/silo-transcode
      downloads:
        type: emptyDir
        advancedMounts:
          silo:
            app:
              - path: /tmp/silo-download-artifacts

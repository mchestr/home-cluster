---
# Shared by both replicas: artwork for every poster size (about 13 MiB per title) and the plugin cache.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: silo-config
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 100Gi
  storageClassName: ceph-filesystem
---
# The Meilisearch index. Rebuilt from the database on demand, so it has no VolSync backup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: silo-meilisearch
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
  storageClassName: ceph-block

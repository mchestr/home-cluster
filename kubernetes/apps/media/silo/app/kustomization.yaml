---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - files:
      - ./resources/silo.sql
    name: silo-initdb
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  disableNameSuffixHash: true
resources:
  - ./backendtrafficpolicy.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./pdb.yaml
  - ./prometheusrule.yaml
  - ./pvc.yaml

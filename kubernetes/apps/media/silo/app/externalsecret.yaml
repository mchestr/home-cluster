---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app silo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: silo-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SECRET_KEY: "{{ .SILO_SECRET_KEY }}"
  dataFrom:
    - extract:
        key: *app
---
# The Meilisearch master key, from the MEILI_MASTER_KEY field of the same 1Password item.
# Meilisearch reads it as its key. Silo reads it as SILO_MEILISEARCH_API_KEY.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-meilisearch
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: silo-meilisearch-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MEILI_MASTER_KEY: "{{ .MEILI_MASTER_KEY }}"
  dataFrom:
    - extract:
        key: silo

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app silo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: silo-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SECRET_KEY: "{{ .SILO_SECRET_KEY }}"
  dataFrom:
    - extract:
        key: *app

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app silo
  namespace: &namespace media
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/cnpg
    - ../../../../components/dragonfly
  dependsOn:
    - name: cloudnative-pg-cluster
      namespace: database
    - name: dragonfly
      namespace: database
    - name: intel-device-plugin-gpu
      namespace: kube-system
    - name: onepassword-store
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 30m
  path: ./kubernetes/apps/media/silo/app
  postBuild:
    substitute:
      APP: *app
      # Playback sessions live in Dragonfly; three replicas survive a node reboot.
      DRAGONFLY_REPLICAS: "3"
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false

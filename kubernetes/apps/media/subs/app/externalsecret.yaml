---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app subs
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: subs-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        NEXTAUTH_SECRET: "{{ .NEXTAUTH_SECRET }}"
        ENCRYPTION_KEYS: "{{ .ENCRYPTION_KEYS }}"
        PLEX_CLIENT_IDENTIFIER: "{{ .PLEX_CLIENT_IDENTIFIER }}"
        DISCORD_BOT_TOKEN: "{{ .MIKEFLIX_APPLICATION_BOT_TOKEN }}"
        DISCORD_SUPPORT_CHANNEL_ID: "{{ .DISCORD_SUPPORT_CHANNEL_ID }}"
        # The SES SMTP login that smtp-relay uses. A subs-only login can replace it later.
        SMTP_USER: "{{ .SES_USERNAME }}"
        SMTP_PASSWORD: "{{ .SES_PASSWORD }}"
  dataFrom:
    - extract:
        key: *app
    - extract:
        key: discord-mflix
    - extract:
        key: aws-ses

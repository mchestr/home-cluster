---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app subs
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  upgrade:
    # Runs DB migrations on upgrade; don't roll back onto a migrated schema
    strategy:
      name: RetryOnFailure
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      subs:
        replicas: 3
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18"
            envFrom:
              - secretRef:
                  name: subs-initdb-secret

        containers:
          main:
            image:
              repository: ghcr.io/mchestr/plex-manager
              tag: 0.6.0@sha256:642053068bbc6b20c9dfff2a2306b763d264e4ad9f48992ee92005ce12e68612
            env:
              NODE_ENV: production
              # Serves pages only; the worker controller runs the queues, schedulers and Discord bot.
              PROCESS_ROLE: web
              NEXT_PUBLIC_APP_URL: https://mikeflix.lol
              NEXTAUTH_URL: https://mikeflix.lol
              # Cloudflare edge and envoy-external both append to X-Forwarded-For.
              TRUSTED_PROXY_HOPS: "2"
              REDIS_URL: redis://subs-dragonfly.media.svc.cluster.local:6379
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: subs-pguser-secret
                    key: uri
            envFrom:
              - secretRef:
                  name: subs-secret
            probes: &probes
              # ?probe=live touches no dependency, so a Redis outage restarts nothing.
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health?probe=live
                    port: &port 3000
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health?probe=live
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 2Gi

      worker:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/mchestr/plex-manager
              tag: 0.6.0@sha256:642053068bbc6b20c9dfff2a2306b763d264e4ad9f48992ee92005ce12e68612
            env:
              NODE_ENV: production
              # Runs the queues, schedulers and Discord bot; serves only /api/health and /api/metrics.
              PROCESS_ROLE: worker
              NEXT_PUBLIC_APP_URL: https://mikeflix.lol
              NEXTAUTH_URL: https://mikeflix.lol
              REDIS_URL: redis://subs-dragonfly.media.svc.cluster.local:6379
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: subs-pguser-secret
                    key: uri
            envFrom:
              - secretRef:
                  name: subs-secret
            probes: *probes
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 2Gi

    service:
      main:
        controller: *app
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - mikeflix.lol
          - wrapped.chestr.dev
          - "{{ .Release.Name }}.chestr.dev"
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: si-plex
          gethomepage.dev/name: Plex Subs
          gethomepage.dev/group: Media
        parentRefs:
          - name: envoy-external
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port

    persistence:
      data:
        type: emptyDir
      tmp:
        type: emptyDir
      nextjs-cache:
        type: emptyDir
        globalMounts:
          - path: /app/.next/cache
      # /app/.next/server is root-owned in the image, so Next.js cannot create this itself.
      route-cache:
        type: emptyDir
        globalMounts:
          - path: /app/.next/server/route-cache

    networkpolicies:
      # Only the external gateway reaches this pod.
      app:
        controller: subs
        policyTypes: [Ingress]
        rules:
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: networking
                  podSelector:
                    matchLabels:
                      gateway.envoyproxy.io/owning-gateway-name: envoy-external
              ports:
                - protocol: TCP
                  port: *port
      # Nothing calls the worker; the kubelet probes are always admitted.
      worker:
        controller: worker
        policyTypes: [Ingress]
        rules:
          ingress: []
      # Cross-node gateway traffic is SNATed to the node, which Cilium sees as the
      # kube-apiserver entity on this all-control-plane cluster (see waitlist).
      cilium:
        type: cilium
        controller: subs
        ingress:
          - fromEntities: [kube-apiserver]
            toPorts:
              - ports:
                  - port: "3000"
                    protocol: TCP

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app whisper
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  values:
    defaultPodOptions:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - plex
              topologyKey: kubernetes.io/hostname
    controllers:
      whisper:
        containers:
          app:
            image:
              repository: onerahmet/openai-whisper-asr-webservice
              tag: v2.0.0@sha256:f68b19f7a3e1ef156dd1a8ca8b4029f4614cd6a7bb8f199362bdf6dd5db99b03
            env:
              TZ: America/Vancouver
              ASR_MODEL: small # tiny, base, small, medium, large, large-v1, large-v2, large-v3, and turbo
              ASR_ENGINE: faster_whisper # openai_whisper, faster_whisper
            resources:
              limits:
                memory: 10Gi

    service:
      app:
        controller: whisper
        ports:
          http:
            port: 9000

    persistence:
      cache:
        existingClaim: *app
        globalMounts:
          - path: /root/.cache/whisper

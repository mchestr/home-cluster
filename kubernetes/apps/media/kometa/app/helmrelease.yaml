---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kometa
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      kometa:
        type: cronjob
        annotations:
          reloader.stakater.com/auto: "true"
        cronjob:
          schedule: "0 */8 * * *"
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        containers:
          app:
            image:
              repository: docker.io/kometateam/kometa
              tag: v2.5.3@sha256:48c3cb318ec984213587f221e8e762c5ad2dbd0e6966efc7bba0a5868a6c5758
            command:
              - /bin/sh
              - -c
            # Each library run rebuilds the playlists from its own library only, so a
            # last run rebuilds them from both libraries.
            args:
              - |
                python3 kometa.py --run --read-only-config --run-libraries "Movies" &&
                python3 kometa.py --run --read-only-config --run-libraries "TV Shows" &&
                python3 kometa.py --run --read-only-config --playlists-only
            env:
              TZ: America/Vancouver
            envFrom:
              - secretRef:
                  name: kometa-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 8Gi
        pod:
          restartPolicy: Never

    persistence:
      config:
        existingClaim: *app
      config-file:
        type: configMap
        name: kometa-configmap
        globalMounts:
          - path: /config/config.yml
            subPath: config.yml
            readOnly: true
          - path: /config/1-moviecharts.yml
            subPath: 1-moviecharts.yml
            readOnly: true
          - path: /config/2-tvcharts.yml
            subPath: 2-tvcharts.yml
            readOnly: true
          - path: /config/3-bestof.yml
            subPath: 3-bestof.yml
            readOnly: true
          - path: /config/7-networks.yml
            subPath: 7-networks.yml
            readOnly: true
      logs:
        type: emptyDir
        globalMounts:
          - path: /config/logs

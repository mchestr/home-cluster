templates:
  Chart:
    sort_title: ++++2.1_<<num>><<collection_name>>
    sync_mode: sync
    smart_label: random

######################################################
#                      Chart                         #
######################################################

collections:
  Plex Popular:
    template: { name: Chart, num: 1.1 }
    tautulli_popular:
      list_days: 30
      list_size: 20
      list_buffer: 20
    tautulli_watched:
      list_days: 30
      list_size: 20
      list_buffer: 20
    summary: Popular Shows on Plex
  Trending:
    template: { name: Chart, num: 1.1 }
    tmdb_trending_daily: 40
    tmdb_trending_weekly: 40
    summary: Trending Shows across the internet
  Popular:
    template: { name: Chart, num: 1.2 }
    tmdb_popular: 40
    imdb_search:
      type: tv_series, tv_mini_series
      sort_by: popularity.asc
      limit: 40
    summary: Popular Shows across the internet
  Top Rated:
    template: { name: Chart, num: 1.3 }
    imdb_search:
      type: tv_series, tv_mini_series
      votes.gte: 20000
      sort_by: rating.desc
      limit: 100
    tmdb_top_rated: 100
    summary: Top Rated Shows across the internet
  Emmy Winners:
    template: { name: Chart, num: 1.4 }
    imdb_search:
      type: tv_series, tv_mini_series
      event.winning: emmy
      sort_by: popularity.asc
      limit: 250
    summary: Emmy Winning Shows

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app unpackerr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: unpackerr-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        UN_RADARR_0_API_KEY: "{{ .RADARR_API_KEY }}"
        UN_SONARR_0_API_KEY: "{{ .SONARR_API_KEY }}"
  dataFrom:
    - extract:
        key: sonarr
    - extract:
        key: radarr
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: unpackerr-metrics
spec:
  length: 64
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpackerr-metrics
spec:
  refreshPolicy: CreatedOnce
  target:
    name: unpackerr-metrics-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        UN_WEBSERVER_API_KEYS_0_KEY: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: unpackerr-metrics

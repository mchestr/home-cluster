---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  # Friendly page Envoy serves in place of 502/503/504 (see envoy.yaml)
  - files:
      - response.body=./resources/error-page.html
    name: envoy-error-page
generatorOptions:
  # The BackendTrafficPolicy references the ConfigMap by its plain name
  disableNameSuffixHash: true
resources:
  - ./certificate.yaml
  - ./envoy.yaml
  - ./grafanadashboard.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./pushsecret.yaml
  - ./servicemonitor.yaml

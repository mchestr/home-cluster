---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns-cloudflare
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  maxHistory: 2
  values:
    fullnameOverride: *app
    provider: cloudflare
    env:
      - name: &name CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: &secret external-dns-cloudflare-secret
            key: *name
    extraArgs:
      - --cloudflare-dns-records-per-page=1000
      - --cloudflare-proxied
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      - --gateway-name=envoy-external
    # The default is A, AAAA and CNAME, which drops the SPF, MX and DMARC entries of a DNSEndpoint.
    # The flag is repeatable, not comma-separated: a joined value is one unknown type and external-dns
    # then manages nothing, so the chart renders one --managed-record-types flag per entry here.
    managedRecordTypes: [A, AAAA, CNAME, TXT, MX]
    policy: sync
    sources:
      - crd
      - gateway-httproute
    txtPrefix: k8s.
    txtOwnerId: "default"
    domainFilters:
      - chestr.dev
      - mikeflix.lol
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret

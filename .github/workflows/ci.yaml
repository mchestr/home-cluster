---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  pull_request:
    branches: ["main"]
    types: ["opened", "synchronize", "reopened", "ready_for_review"]
  # Renovate automerges straight from its branches without opening a PR, so
  # test every push to them; Renovate waits for these checks before merging.
  push:
    branches: ["renovate/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changed Files
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      kubernetes: ${{ steps.changed-files.outputs.kubernetes_any_changed }}
      cluster: ${{ steps.changed-files.outputs.cluster_any_changed }}
      workflows: ${{ steps.changed-files.outputs.workflows_any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            kubernetes:
              - kubernetes/**
            cluster:
              - .github/workflows/ci.yaml
              - .github/workflows/renovate-risk.yaml
              - .github/renovate-risk/**
              - .claude/skills/renovate-review/**
              - bootstrap/**
              - kubernetes/**
              - talos/**
              - terraform/**
            renovate:
              - .renovaterc.json5
            workflows:
              - .github/workflows/**

      # --no-global checks the file as repo config, which is how Renovate reads it
      - name: Validate Renovate Config
        if: ${{ steps.changed-files.outputs.renovate_any_changed == 'true' }}
        env:
          # renovate: datasource=github-releases depName=renovatebot/renovate
          RENOVATEBOT_VERSION: 44.195.1
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          --entrypoint renovate-config-validator
          "ghcr.io/renovatebot/renovate:${RENOVATEBOT_VERSION}"
          --strict --no-global .renovaterc.json5

  flate:
    name: Flate Test
    needs: ["changes"]
    # A Renovate PR's commits are already tested by the push trigger
    if: >-
      ${{
        !cancelled() &&
        (
          github.event_name == 'push' ||
          (needs.changes.outputs.cluster == 'true' && !startsWith(github.head_ref, 'renovate/'))
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pull Request Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pull
          # Full history, to find the commit the change starts from
          fetch-depth: 0
          persist-credentials: false

      # Diff against the commit the change starts from, not the tip of main.
      # A renovate/** branch can be behind main, and newer commits on main
      # would then show as reverted. For a pull request this is the base of
      # GitHub's merge commit.
      - name: Find Base Commit
        id: base
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          sha=$(git -C pull merge-base "origin/${DEFAULT_BRANCH}" HEAD)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout Base Commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: default
          persist-credentials: false

      - name: Install flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          # The action otherwise exports FLATE_BASE=main, which makes `flate test`
          # check only the changed files and clashes with --path-orig
          base: ""

      # Keep the output for the Renovate risk assessment
      - name: Build Kustomizations and render HelmReleases
        run: |
          mkdir -p flate-out
          rc=0
          flate test all --path pull/kubernetes/flux/cluster > flate-out/test.log 2>&1 || rc=$?
          cat flate-out/test.log
          exit "${rc}"

      # Rendered manifests (charts templated) before and after the update, so
      # the risk assessment sees exactly what would change in the cluster.
      # CRDs are included, so the reviewer can check schema changes.
      - name: Diff Rendered Resources
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          mkdir -p flate-out
          for kind in helmrelease kustomization; do
            flate diff "${kind}" \
              --path pull/kubernetes/flux/cluster \
              --path-orig default/kubernetes/flux/cluster \
              --skip-crds=false \
              --output diff \
              > "flate-out/diff-${kind}.patch" 2> "flate-out/diff-${kind}.log" \
              || cat "flate-out/diff-${kind}.log"
          done

      - name: Upload Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flate
          path: flate-out/

  risk:
    name: Risk Assessment
    needs: ["flate"]
    # Also runs when the test fails, so Claude can explain and fix the breakage.
    # Skips fork PRs (no secrets) and drafts (reviewed once marked ready).
    if: >-
      ${{
        !cancelled() && needs.flate.result != 'skipped' &&
        (
          (github.event_name == 'push' && !github.event.deleted) ||
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            !github.event.pull_request.draft
          )
        )
      }}
    uses: ./.github/workflows/renovate-risk.yaml
    permissions:
      contents: read
      actions: read
    secrets: inherit
    with:
      flate-result: ${{ needs.flate.result }}

  flux-diff:
    name: Flux Diff
    needs: ["changes"]
    if: ${{ needs.changes.outputs.kubernetes == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        resources: ["helmrelease", "kustomization"]
      fail-fast: false
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: "${{ secrets.BOT_APP_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"

      - name: Checkout Pull Request Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pull
          persist-credentials: false

      - name: Checkout Default Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.event.repository.default_branch }}"
          path: default
          persist-credentials: false

      - name: Install flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          base: ""

      # On a render failure flate still writes the rest of the diff, with a
      # "!" line for each HelmRelease or Kustomization it left out, so post
      # the comment first and fail the job in the last step
      - name: Diff Resources
        id: flate
        env:
          RESOURCES: ${{ matrix.resources }}
        run: |
          rc=0
          flate diff "${RESOURCES}" \
            --path pull/kubernetes/flux/cluster \
            --path-orig default/kubernetes/flux/cluster \
            --output github \
            > diff.patch || rc=$?
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

      - name: Generate Diff
        id: diff
        env:
          # A PR comment holds at most 65536 characters
          COMMENT_LIMIT: 60000
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat diff.patch
          delimiter="EOF_$(openssl rand -hex 8)"
          {
              echo "diff<<${delimiter}"
              if [[ "$(wc -c < diff.patch)" -gt "${COMMENT_LIMIT}" ]]; then
                  # Cut at a line end, not inside a character
                  head -c "${COMMENT_LIMIT}" diff.patch | sed '$d'
              else
                  cat diff.patch
                  # The delimiter must start a new line
                  [[ -s diff.patch && -n "$(tail -c 1 diff.patch)" ]] && echo
              fi
              echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
          if [[ "$(wc -c < diff.patch)" -gt "${COMMENT_LIMIT}" ]]; then
              echo "note=Truncated: the full diff is in the [job summary](${RUN_URL})." >> "$GITHUB_OUTPUT"
          fi
          {
              echo "### Diff"
              echo '```diff'
              cat diff.patch
              echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add Comment
        if: ${{ steps.diff.outputs.diff != '' }}
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
        with:
          repo-token: "${{ steps.app-token.outputs.token }}"
          message-id: "${{ github.event.pull_request.number }}/kubernetes/${{ matrix.resources }}"
          message-failure: Diff was not successful
          message: |
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```
            ${{ steps.diff.outputs.note }}

      - name: Check Render
        if: ${{ steps.flate.outputs.rc != '0' }}
        run: |
          echo "::error::flate could not render every resource; see the Diff Resources step"
          exit 1

  image-pull-extract:
    name: Image Pull - Extract Images
    needs: ["changes"]
    if: ${{ needs.changes.outputs.kubernetes == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - name: Checkout Pull Request Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pull
          persist-credentials: false

      - name: Checkout Default Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.event.repository.default_branch }}"
          path: default
          persist-credentials: false

      - name: Install flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          base: ""

      # Lists the images the pull request adds, compared with the default branch
      - name: Extract New Images
        id: images
        run: |
          flate diff images \
            --path pull/kubernetes/flux/cluster \
            --path-orig default/kubernetes/flux/cluster \
            --output json \
            > images.json
          echo "images=$(jq --compact-output '.' images.json)" >> "$GITHUB_OUTPUT"
          {
              echo '## New images to Pull'
              echo '```json'
              jq '.' images.json
              echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  image-pull:
    name: Image Pull - Pull Images
    needs: ["image-pull-extract"]
    # Self-hosted runner with node credentials: never for a fork's pull request
    if: >-
      ${{
        needs.image-pull-extract.outputs.images != '[]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: home-cluster-runner
    strategy:
      matrix:
        images: ${{ fromJSON(needs.image-pull-extract.outputs.images) }}
      max-parallel: 4
      fail-fast: false
    steps:
      - name: Install talosctl
        run: curl -fsSL https://talos.dev/install | sh

      - name: Pull Image
        env:
          IMAGE: ${{ matrix.images }}
        run: talosctl --nodes "$NODE" image pull "$IMAGE"

  actionlint:
    name: actionlint
    needs: ["changes"]
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        # Report only until the existing findings are fixed
        continue-on-error: true
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  zizmor:
    name: zizmor
    needs: ["changes"]
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        # Report only until the existing findings are fixed
        continue-on-error: true
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          annotations: true

  status:
    name: CI Success
    if: ${{ !cancelled() }}
    needs:
      - changes
      - flate
      - risk
      - flux-diff
      - image-pull-extract
      - image-pull
      - actionlint
      - zizmor
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "All jobs passed or skipped" && echo "$RESULTS"

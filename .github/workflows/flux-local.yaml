---
name: "Flux Local"

on:
  pull_request:
    branches: ["main"]
    paths:
      - .github/workflows/flux-local.yaml
      - kubernetes/**
  # Renovate automerges straight from its branches without opening a PR, so
  # test every push to them; Renovate waits for this check before merging.
  push:
    branches: ["renovate/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Flux Local Test
    # A Renovate PR's commits are already tested by the push trigger
    if: ${{ github.event_name == 'push' || !startsWith(github.head_ref, 'renovate/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Kustomizations and render HelmReleases
        uses: docker://ghcr.io/allenporter/flux-local:v8.0.1@sha256:5c8cb0ff9d26a5260a47e7b3949403d80713d80037b9f0e4c02c5efca3588518
        with:
          args: >-
            test
            --enable-helm
            --all-namespaces
            --path kubernetes/flux/cluster
            --sources flux-system

---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Renovate Config"

on:
  pull_request:
    branches: ["main"]
    paths:
      - .github/renovate.json5
      - .github/renovate/**
      - .github/workflows/renovate-config.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # renovate: datasource=github-releases depName=renovatebot/renovate
      RENOVATEBOT_VERSION: 44.167.5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run renovate-config-validator
        # --no-global checks the files as repo config, which is how Renovate reads them
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          --entrypoint renovate-config-validator
          "ghcr.io/renovatebot/renovate:${RENOVATEBOT_VERSION}"
          --strict --no-global .github/renovate.json5 .github/renovate/*.json5

---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Risk Assessment"

on:
  # Called by CI after flate tests a push to a renovate/** branch or a PR,
  # and renders the manifest diff. Renovate waits for this check before
  # automerging, and a high verdict holds the update in a PR (Hold for Review).
  workflow_call:
    inputs:
      flate-result:
        description: Result of the Flate Test job
        type: string
        required: true
  # Once Renovate opens a PR (for a failed check or a non-automerge update),
  # post the assessment that was already made for its head commit.
  pull_request:
    types: ["opened"]
    branches: ["main"]

permissions:
  contents: read

env:
  REPORT_MARKER: "<!-- renovate-risk -->"

jobs:
  assess:
    name: Assess
    if: ${{ inputs.flate-result != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # renovate: datasource=npm depName=@anthropic-ai/claude-code
      CLAUDE_CODE_VERSION: 2.1.312
      CLAUDE_MODEL: claude-sonnet-5
      BRANCH: ${{ github.head_ref || github.ref_name }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          repositories: home-cluster
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR head, not the merge commit, so a proposed fix applies to it
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download Flate Results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: flate
          path: ${{ runner.temp }}/flate

      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Assess Update
        env:
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Read-only token: release notes are untrusted input, so Claude gets
          # no credentials that can write anywhere.
          GH_TOKEN: ${{ github.token }}
          FLATE_RESULT: ${{ inputs.flate-result }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          flate_dir="${RUNNER_TEMP}/flate"
          mkdir -p "${flate_dir}"
          # Without this line, Claude can follow the skill's interactive step 0 and stop at the blocked gh pr commands
          prompt="This is the CI run, not an interactive session. Skip step 0, and do not run gh pr commands: the change is checked out at HEAD, and its flate results are at the end of this prompt.

          $(awk 'f >= 2; /^---$/ { f++ }' .claude/skills/renovate-review/SKILL.md)

          ## flate results for this branch

          - \`flate test all\` (builds every Kustomization, renders every HelmRelease and checks every Flux source): **${FLATE_RESULT}**. Output: \`${flate_dir}/test.log\`
          - Rendered diff against main (the commit the change starts from), Helm charts templated, CRDs included: \`${flate_dir}/diff-helmrelease.patch\`
          - Kustomization diff against the same commit, CRDs included: \`${flate_dir}/diff-kustomization.patch\`
          - Files present: $(ls "${flate_dir}" | tr '\n' ' ')"
          if [[ -n "${PR_NUMBER}" && "${BRANCH}" != renovate/* ]]; then
            prompt+="$(printf '\n\n%s\n\n## Pull request #%s by @%s: %s\n\n%s\n' \
              "$(cat .github/renovate-risk/pull-request.md)" "${PR_NUMBER}" "${PR_AUTHOR}" "${PR_TITLE}" "${PR_BODY}")"
          fi
          [[ -n "${ANTHROPIC_KEY}" ]] && export ANTHROPIC_API_KEY="${ANTHROPIC_KEY}"
          [[ -n "${CLAUDE_OAUTH}" ]] && export CLAUDE_CODE_OAUTH_TOKEN="${CLAUDE_OAUTH}"
          claude --print "${prompt}" \
            --add-dir "${flate_dir}" \
            --model "${CLAUDE_MODEL}" \
            --max-turns 60 \
            --output-format json \
            --json-schema "$(cat .github/renovate-risk/schema.json)" \
            --allowedTools \
              "Read" "Grep" "Glob" "Edit" "WebFetch" "WebSearch" \
              "Bash(git diff:*)" "Bash(git log:*)" "Bash(git show:*)" \
              "Bash(gh release view:*)" "Bash(gh release list:*)" "Bash(gh api:*)" \
              "Bash(helm show:*)" "Bash(helm repo add:*)" "Bash(helm search:*)" \
            > "${RUNNER_TEMP}/claude.json" || true
          # Fail closed: no verdict means no automerge
          if ! jq -e '.structured_output.risk' "${RUNNER_TEMP}/claude.json" > /dev/null; then
            echo "::error::Claude did not return an assessment"
            jq -r '.result // .' "${RUNNER_TEMP}/claude.json" || cat "${RUNNER_TEMP}/claude.json"
            exit 1
          fi
          # A renovate/ branch always updates something, so no updates means Claude reviewed nothing
          if [[ "${BRANCH}" == renovate/* ]] && jq -e '.structured_output.updates | length == 0' "${RUNNER_TEMP}/claude.json" > /dev/null; then
            echo "::error::Claude found no updates to assess"
            jq '.structured_output' "${RUNNER_TEMP}/claude.json"
            exit 1
          fi
          jq '.structured_output' "${RUNNER_TEMP}/claude.json" > "${RUNNER_TEMP}/assessment.json"
          jq . "${RUNNER_TEMP}/assessment.json"

      - name: Propose Fix
        id: fix
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Only commit edits to cluster config, whatever else Claude touched
          git add -- kubernetes talos terraform bootstrap
          if [[ "$(jq -r '.risk' "${RUNNER_TEMP}/assessment.json")" != "high" ]] || git diff --cached --quiet; then
            exit 0
          fi
          fix_branch="risk-fix/${BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "${fix_branch}"
          git commit --quiet --file - <<EOF
          fix: address risk assessment for ${BRANCH}

          $(jq -r '.fix_description' "${RUNNER_TEMP}/assessment.json")
          EOF
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${fix_branch}"
          url=$(gh pr list --head "${fix_branch}" --base "${BRANCH}" --json url --jq '.[0].url')
          if [[ -z "${url}" ]]; then
            url=$(gh pr create --head "${fix_branch}" --base "${BRANCH}" \
              --title "fix: address risk assessment for ${BRANCH}" \
              --body "$(jq -r '"Proposed by the risk assessment to make `\(env.BRANCH)` safe to merge.\n\n\(.fix_description)"' "${RUNNER_TEMP}/assessment.json")")
          fi
          echo "url=${url}" >> "${GITHUB_OUTPUT}"

      - name: Write Report
        env:
          FIX_URL: ${{ steps.fix.outputs.url }}
          FLATE_RESULT: ${{ inputs.flate-result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -r --arg marker "${REPORT_MARKER}" \
            --from-file <(git show HEAD:.github/renovate-risk/report.jq) \
            "${RUNNER_TEMP}/assessment.json" > "${RUNNER_TEMP}/report.md"
          cp "${RUNNER_TEMP}/assessment.json" "${RUNNER_TEMP}/report.md" .
          cat report.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renovate-risk
          path: |
            assessment.json
            report.md

      # A failing check alone doesn't hold a Renovate update: Renovate rebases
      # automerge branches whenever main moves, the rebased commit is assessed
      # again, and a lower verdict lets it automerge. So on a high verdict, open
      # the PR as the Renovate app (Renovate adopts PRs from its own user) with
      # Renovate's stop-updating label, which stops it rebasing or automerging
      # the branch until the label is removed.
      - name: Hold for Review
        id: hold
        if: ${{ github.event_name == 'push' && startsWith(env.BRANCH, 'renovate/') }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HOLD_LABEL: stop-updating
          FIX_URL: ${{ steps.fix.outputs.url }}
        run: |
          [[ "$(jq -r '.risk' assessment.json)" == "high" ]] || exit 0
          pr=$(gh pr list --head "${BRANCH}" --base main --json number --jq '.[0].number // empty')
          if [[ -n "${pr}" ]]; then
            gh pr edit "${pr}" --add-label "${HOLD_LABEL}" > /dev/null
            url=$(gh pr view "${pr}" --json url --jq '.url')
          else
            body="Renovate would have automerged this update, but the risk assessment rated it **high risk**, so it's held here for review. The assessment is in the comment below."
            [[ -n "${FIX_URL}" ]] && body+=$'\n\n'"A proposed fix is in ${FIX_URL}."
            body+=$'\n\n'"- **Merge** this PR yourself once you're happy with it."
            body+=$'\n'"- **Remove the \`${HOLD_LABEL}\` label** to hand it back to Renovate. It will rebase, reassess, and automerge unless the new verdict is high again."
            body+=$'\n'"- **Close** this PR to skip this version."
            url=$(gh pr create --head "${BRANCH}" --base main \
              --title "$(git log -1 --format=%s "${GITHUB_SHA}")" \
              --body "${body}" --label "${HOLD_LABEL}")
          fi
          echo "url=${url}" >> "${GITHUB_OUTPUT}"

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pr="${PR_NUMBER:-$(gh pr list --head "${BRANCH}" --base main --json number --jq '.[0].number')}"
          [[ -z "${pr}" ]] && exit 0
          comment=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" --paginate \
            --jq "map(select(.body | startswith(\"${REPORT_MARKER}\"))) | .[0].id // empty")
          if [[ -n "${comment}" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment}" -F body=@report.md > /dev/null
          else
            gh pr comment "${pr}" --body-file report.md
          fi

      - name: Gate Automerge
        run: |
          risk=$(jq -r '.risk' assessment.json)
          echo "Risk: ${risk}"
          if [[ "${risk}" == "high" ]]; then
            echo "::error::High risk change: $(jq -r '.summary' assessment.json)"
            exit 1
          fi

      # Both a high-risk verdict and a failed assessment block automerge, so say
      # so right away
      - name: Notify Blocked
        if: ${{ failure() && github.event_name == 'push' }}
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          FIX_URL: ${{ steps.fix.outputs.url }}
          HOLD_URL: ${{ steps.hold.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "${PUSHOVER_TOKEN}" || -z "${PUSHOVER_USER_KEY}" ]]; then
            echo "Pushover not configured"
            exit 0
          fi
          name="${BRANCH#renovate/}"
          if [[ "$(jq -r '.risk' assessment.json 2>/dev/null)" == "high" ]]; then
            title="🔴 Blocked: ${name}"
            message="$(jq -r '.headline' assessment.json)"
            [[ -n "${HOLD_URL}" ]] && message+=$'\n'"Held for review: ${HOLD_URL}"
            [[ -n "${FIX_URL}" ]] && message+=$'\n'"Proposed fix: ${FIX_URL}"
          else
            title="⚠️ Risk assessment failed: ${name}"
            message="Automerge is blocked until it passes. Re-run the job once the cause is fixed."
          fi
          curl --silent --show-error --fail \
            --form-string "token=${PUSHOVER_TOKEN}" \
            --form-string "user=${PUSHOVER_USER_KEY}" \
            --form-string "title=${title}" \
            --form-string "message=${message}" \
            --form-string "url=${RUN_URL}" \
            --form-string "url_title=Assessment run" \
            https://api.pushover.net/1/messages.json > /dev/null

  comment:
    name: Renovate Risk Comment
    # Only on this workflow's own pull_request trigger, not when called
    if: ${{ inputs.flate-result == '' && github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          repositories: home-cluster
          permission-pull-requests: write

      - name: Post Assessment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.number }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # The push run for this commit may still be going; it comments itself
          # when it finishes if the PR exists by then.
          run=$(gh run list --workflow ci.yaml --event push --commit "${SHA}" \
            --status completed --limit 1 --json databaseId --jq '.[0].databaseId')
          if [[ -z "${run}" ]] || ! gh run download "${run}" --name renovate-risk; then
            echo "No completed assessment for ${SHA} yet"
            exit 0
          fi
          GH_TOKEN="${APP_TOKEN}" gh pr comment "${PR}" --body-file report.md
